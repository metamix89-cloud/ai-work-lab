<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가나다식품 경영 현황</title>
<style>
body{font-family:sans-serif;margin:24px;color:#222}
.bar-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.card{border:1px solid #ccc;border-radius:8px;padding:12px 16px;min-width:140px}
.card .l{font-size:12px;color:#666}.card .v{font-size:24px;font-weight:bold}
.daily{display:flex;gap:6px;align-items:flex-end;height:140px;margin:16px 0}
.daily div{flex:1;background:#4a7bd0;min-width:20px;position:relative}
.daily div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;color:#222}
.daily-wrap{display:flex;gap:6px}.lbl{flex:1;font-size:10px;text-align:center;min-width:20px}
table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 10px}
#message{color:#b00;min-height:20px}
</style>
</head>
<body>
<h1>경영 현황</h1>
<div class="bar-row">
  <select data-testid="user"></select>
  <input type="date" data-testid="from">
  <input type="date" data-testid="to">
  <button data-testid="apply">적용</button>
  <span class="upd" id="upd"></span>
</div>
<div id="message" data-testid="message"></div>
<div id="err" hidden>불러오지 못했습니다 <button id="retry">다시 시도</button></div>
<div id="cards" class="cards"></div>
<div id="daily"></div>
<div id="top"></div>
<script>
var LABELS={orders:'주문 수',revenue:'매출',cancel_rate:'취소율',stock_alerts:'재고 경고',open_inquiries:'미처리 문의'};
var TID={orders:'m-orders',revenue:'m-revenue',cancel_rate:'m-cancel-rate',stock_alerts:'m-stock-alerts',open_inquiries:'m-open-inquiries'};
var $=function(q){return document.querySelector(q)};
function fmt(k,v){
  if(v===null||v===undefined)return '—';
  if(k==='revenue')return v.toLocaleString('en-US');
  if(k==='cancel_rate')return v+'%';
  return String(v);
}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(b){
  var c=$('#cards');c.innerHTML='';
  Object.keys(b.metrics).forEach(function(k){
    var d=document.createElement('div');d.className='card';d.setAttribute('data-testid',TID[k]);
    d.innerHTML='<div class="l">'+LABELS[k]+'</div><div class="v">'+fmt(k,b.metrics[k])+'</div>';
    c.appendChild(d);
  });
  var max=Math.max.apply(null,b.daily.map(function(x){return x.count}).concat([1]));
  var h='<div class="daily">';
  b.daily.forEach(function(x){
    h+='<div data-testid="daily-bar" title="'+x.date+'" style="height:'+Math.max(2,x.count/max*120)+'px"><span>'+x.count+'</span></div>';
  });
  h+='</div><div class="daily-wrap">';
  b.daily.forEach(function(x){h+='<div class="lbl">'+x.date.slice(5)+'</div>'});
  $('#daily').innerHTML=h+'</div>';
  var t=$('#top');
  if(b.top_customers){
    h='<h3>거래처별 매출 상위 5</h3><table><tr><th>거래처</th><th>매출</th></tr>';
    b.top_customers.forEach(function(x){
      h+='<tr data-testid="top-customer"><td>'+esc(x.customer)+'</td><td>'+x.revenue.toLocaleString('en-US')+'</td></tr>';
    });
    t.innerHTML=h+'</table>';
  }else t.innerHTML='';
  $('#upd').textContent='기준 '+b.updated_at;
}
function load(first){
  var q='viewer='+encodeURIComponent($('[data-testid=user]').value);
  var f=$('[data-testid=from]').value,t=$('[data-testid=to]').value;
  if(!first){
    if(f||t){ if(f)q+='&from='+encodeURIComponent(f); if(t)q+='&to='+encodeURIComponent(t); }
  }
  return fetch('/api/dashboard?'+q).then(function(r){
    return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}});
  }).then(function(r){
    $('#err').hidden=true;
    if(!r.ok){
      if(r.status===400||r.status===404){$('#message').textContent=r.j.detail;return}
      throw new Error('x');
    }
    $('#message').textContent='';
    if(first){$('[data-testid=from]').value=r.j.period.from;$('[data-testid=to]').value=r.j.period.to}
    render(r.j);
  }).catch(function(){
    $('#cards').innerHTML='';$('#daily').innerHTML='';$('#top').innerHTML='';
    $('#err').hidden=false;
  });
}
$('[data-testid=apply]').onclick=function(){load(false)};
$('[data-testid=user]').onchange=function(){load(false)};
$('#retry').onclick=function(){init()};
function init(){
  fetch('/api/users').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(us){
    var s=$('[data-testid=user]');
    if(!s.options.length)us.forEach(function(u){var o=document.createElement('option');o.value=u.user_id;o.textContent=u.name;s.appendChild(o)});
    return load(!$('[data-testid=from]').value);
  }).catch(function(){$('#err').hidden=false});
}
init();
</script>
</body>
</html>
