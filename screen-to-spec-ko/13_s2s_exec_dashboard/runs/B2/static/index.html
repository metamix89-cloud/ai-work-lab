<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 경영 현황 대시보드</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .bar label { font-size: 14px; }
  select, input, button { font: inherit; padding: 4px 8px; }
  #message { min-height: 20px; color: #c0392b; margin-bottom: 8px; }
  #cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 8px; padding: 14px 18px; min-width: 150px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card .label { font-size: 13px; color: #666; }
  .card .value { font-size: 26px; font-weight: bold; margin-top: 4px; }
  section { background: #fff; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  #daily { display: flex; align-items: flex-end; gap: 6px; height: 160px; }
  .day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; min-width: 0; }
  .day .fill { width: 100%; background: #3b82f6; border-radius: 3px 3px 0 0; }
  .day .n { font-weight: bold; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
  td.num, th.num { text-align: right; }
  #error { background: #fff; padding: 20px; border-radius: 8px; text-align: center; }
  #updated { font-size: 12px; color: #888; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>가나다식품 경영 현황 대시보드</h1>
  <div class="bar">
    <label>사용자 <select data-testid="user" id="user"></select></label>
    <label>시작일 <input type="date" data-testid="from" id="from"></label>
    <label>종료일 <input type="date" data-testid="to" id="to"></label>
    <button data-testid="apply" id="apply">적용</button>
    <span id="updated"></span>
  </div>
  <div id="message" data-testid="message"></div>
  <div id="error" hidden>
    <p>불러오지 못했습니다</p>
    <button id="retry">다시 시도</button>
  </div>
  <div id="content">
    <div id="cards"></div>
    <section><h2>일별 주문</h2><div id="daily"></div></section>
    <section id="top-section" hidden>
      <h2>거래처별 매출 상위 5</h2>
      <table><thead><tr><th>거래처</th><th class="num">매출</th></tr></thead><tbody id="top"></tbody></table>
    </section>
  </div>
</main>
<script>
const LABELS = [
  ["orders", "주문 수", "m-orders"],
  ["revenue", "매출", "m-revenue"],
  ["cancel_rate", "취소율", "m-cancel-rate"],
  ["stock_alerts", "재고 경고", "m-stock-alerts"],
  ["open_inquiries", "미처리 문의", "m-open-inquiries"],
];
const $ = (id) => document.getElementById(id);
let seq = 0;

function fmt(key, v) {
  if (v === null || v === undefined) return "—";
  if (key === "revenue") return v.toLocaleString("en-US");
  if (key === "cancel_rate") return v + "%";
  return String(v);
}

function clearAll() {
  $("cards").innerHTML = "";
  $("daily").innerHTML = "";
  $("top").innerHTML = "";
  $("top-section").hidden = true;
}

function render(data) {
  clearAll();
  $("from").value = data.period.from;
  $("to").value = data.period.to;
  $("updated").textContent = "기준 " + data.updated_at;
  for (const [key, label, tid] of LABELS) {
    if (!(key in data.metrics)) continue;
    const c = document.createElement("div");
    c.className = "card";
    const l = document.createElement("div");
    l.className = "label";
    l.textContent = label;
    const v = document.createElement("div");
    v.className = "value";
    v.dataset.testid = tid;
    v.textContent = fmt(key, data.metrics[key]);
    c.append(l, v);
    $("cards").append(c);
  }
  const max = Math.max(1, ...data.daily.map((d) => d.count));
  for (const d of data.daily) {
    const b = document.createElement("div");
    b.className = "day";
    b.dataset.testid = "daily-bar";
    b.title = d.date + " " + d.count + "건";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = d.count;
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.height = (d.count / max) * 100 + "px";
    const dt = document.createElement("span");
    dt.textContent = d.date.slice(5);
    b.append(n, fill, dt);
    $("daily").append(b);
  }
  $("top-section").hidden = !("top_customers" in data);
  for (const t of data.top_customers || []) {
    const tr = document.createElement("tr");
    tr.dataset.testid = "top-customer";
    const a = document.createElement("td");
    a.textContent = t.customer;
    const r = document.createElement("td");
    r.className = "num";
    r.textContent = t.revenue.toLocaleString("en-US");
    tr.append(a, r);
    $("top").append(tr);
  }
}

function showError() {
  $("content").hidden = true;
  $("error").hidden = false;
}

async function load(useInputs) {
  const my = ++seq;
  const p = new URLSearchParams({ viewer: $("user").value });
  if (useInputs) {
    if ($("from").value) p.set("from", $("from").value);
    if ($("to").value) p.set("to", $("to").value);
  }
  $("message").textContent = "";
  try {
    const res = await fetch("/api/dashboard?" + p);
    let body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    if (my !== seq) return;
    if (res.ok && body) {
      $("error").hidden = true;
      $("content").hidden = false;
      render(body);
    } else if (body && typeof body.detail === "string" && res.status < 500) {
      $("error").hidden = true;
      $("content").hidden = false;
      clearAll();
      $("message").textContent = body.detail;
    } else {
      showError();
    }
  } catch (e) {
    if (my === seq) showError();
  }
}

const ROLE = { exec: "대표", sales: "영업팀", logistics: "물류팀" };

async function init() {
  try {
    const res = await fetch("/api/users");
    if (!res.ok) throw new Error("fail");
    const users = await res.json();
    const sel = $("user");
    sel.innerHTML = "";
    for (const u of users) {
      const o = document.createElement("option");
      o.value = u.user_id;
      o.textContent = u.name + " (" + (ROLE[u.role] || u.role) + ")";
      sel.append(o);
    }
    await load(false);
  } catch (e) {
    showError();
  }
}

$("apply").addEventListener("click", () => load(true));
$("user").addEventListener("change", () => load(true));
$("retry").addEventListener("click", () => ($("user").options.length ? load(true) : init()));
init();
</script>
</body>
</html>
