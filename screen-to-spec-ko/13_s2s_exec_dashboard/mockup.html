<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>가나다식품 경영 현황 대시보드 — 목업</title>
<!-- 「이 화면, PRD 로는 이렇게」 13편 목업. 가상 회사 · 가상 거래처 · 가상 숫자. ?state=ok|empty|error. Mock-IT 라이트 테마. -->
<style>
:root{--ink:#111318;--ink2:#4B5563;--mute:#8A94A6;--line:#E6E8EF;--bg:#F4F5F9;--indigo:#6366F1;--emerald:#10B981;--amber:#F59E0B;--rose:#EF4444}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);width:1450px;height:560px;overflow:hidden}
.app{display:grid;grid-template-columns:200px 1fr;height:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:22px 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-bottom:26px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--indigo);display:inline-block}
.nav div{padding:10px 12px;border-radius:8px;color:var(--ink2);font-size:14px;margin-bottom:4px}
.nav .on{background:#EEF0FF;color:var(--indigo);font-weight:700}
.main{padding:16px 26px 14px 26px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;justify-content:space-between;align-items:flex-end}
h1{margin:0;font-size:21px;letter-spacing:-.3px}.sub{color:var(--mute);font-size:12px;margin-top:3px}
.ctl{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.ctl span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}.ctl b{background:var(--indigo);color:#fff;border-radius:7px;padding:6px 12px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.card .l{font-size:12px;color:var(--ink2)}.card .n{font-size:24px;font-weight:800;margin-top:2px}.card .h{font-size:10.5px;color:var(--mute);margin-top:2px}
.row{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;flex:1;min-height:0}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:0}
.box h3{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:0 6px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--ink2)}
.bar i{display:block;width:100%;background:linear-gradient(180deg,#818CF8,#6366F1);border-radius:6px 6px 0 0}
.days{display:flex;gap:14px;padding:4px 6px 0;font-size:10.5px;color:var(--mute)}.days span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:12.5px}td{padding:6px 4px;border-bottom:1px solid var(--line)}td.r{text-align:right;font-weight:700}
.tie{color:var(--amber);font-size:10.5px}
.roles{font-size:11px;color:var(--ink2);background:#EEF0FF;border-radius:7px;padding:6px 9px;margin-top:8px;line-height:1.5}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);gap:4px;font-size:12px;text-align:center}
.err{background:#FFF5F5;border:1px solid #FECACA;color:#991B1B;border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.err button{background:#fff;border:1px solid #FCA5A5;color:#991B1B;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700}
</style></head><body>
<div class="app">
 <div class="side">
  <div class="logo"><i></i>가나다식품</div>
  <div class="nav"><div>오늘의 현황판</div><div class="on">경영 현황</div><div>주문 · 재고</div><div>쇼핑몰</div></div>
 </div>
 <div class="main" id="main"></div>
</div>
<script>
const state=(new URLSearchParams(location.search).get('state'))||'ok';
const head=(from,to)=>`<div class="top"><div><h1>경영 현황</h1><div class="sub">기간은 양 끝 포함(최대 31일) · 매출은 출고 기준 · 취소율 분모 0 이면 — · 역할마다 보이는 지표가 다르다(응답에도 없다)</div></div>
 <div class="ctl"><span>사용자: 한대표 (대표) ▾</span><span>${from}</span>~<span>${to}</span><b>적용</b></div></div>`;
const card=(l,n,h)=>`<div class="card"><div class="l">${l}</div><div class="n">${n}</div><div class="h">${h}</div></div>`;
const roles=`<div class="roles">대표: 전부 · 영업팀: 주문 · 매출 · 취소율 · 미처리 문의 · 물류팀: 주문 · 재고 경고 — 못 보는 카드는 그리지도, 응답에 싣지도 않는다</div>`;
let html='';
if(state==='ok'){
  const b=[1,0,1,1,0,2,3],d=['10-18','10-19','10-20','10-21','10-22','10-23','10-24'];
  html=head('2026-10-18','2026-10-24')+`<div class="cards">${card('주문 수','8','취소 제외')}${card('매출','600,000원','출고만 — 접수 80,000 제외')}${card('취소율','27.3%','3 ÷ 11, 첫째 자리 반올림')}${card('재고 경고','2','qty &lt; 안전재고 (같으면 아님)')}${card('미처리 문의','3','기간 안에 들어온 것만')}</div>
  <div class="row"><div class="box"><h3>일별 주문 (0 인 날도 칸)</h3><div class="bars">${b.map(v=>`<div class="bar">${v}<i style="height:${v/3*120}px"></i></div>`).join('')}</div><div class="days">${d.map(x=>`<span>${x}</span>`).join('')}</div></div>
  <div class="box"><h3>거래처별 매출 상위 5 (대표만)</h3><table>
   <tr><td>1 마루푸드</td><td class="r">200,000</td></tr><tr><td>2 한빛상회</td><td class="r">180,000</td></tr>
   <tr><td>3 늘봄유통 <span class="tie">같은 매출 → 이름 순</span></td><td class="r">90,000</td></tr><tr><td>4 새봄식당</td><td class="r">90,000</td></tr><tr><td>5 두레마트</td><td class="r">30,000</td></tr></table>${roles}</div></div>`;
}else if(state==='empty'){
  html=head('2026-09-24','2026-09-29')+`<div class="cards">${card('주문 수','0','주문이 없는 기간')}${card('매출','0원','')}${card('취소율','—','분모 0 — 0% 가 아니다')}${card('재고 경고','2','기간과 상관없는 지금 값')}${card('미처리 문의','1','이 기간에 들어온 1건')}</div>
  <div class="row"><div class="box"><div class="empty"><b style="color:#4B5563;font-size:15px">이 기간엔 주문이 없습니다</b>막대는 날 수만큼(6칸) 0 으로 — 칸을 지우지 않는다</div></div><div class="box"><div class="empty">거래처 매출 없음</div></div></div>`;
}else{
  html=head('2026-10-24','2026-10-23')+`<div class="err"><div><b>기간을 확인하세요.</b> 시작일이 종료일보다 늦습니다 — 서버가 400 으로 거부, 화면은 detail 을 그대로 보여 준다.</div><button>다시 시도</button></div>
  <div class="box" style="flex:1"><div class="empty">지표 계산 · 기간 · 역할별 숨김은 서버가 한다 — 화면이 카드를 숨겨도 응답에 매출이 있으면 숨긴 게 아니다</div></div>`;
}
document.getElementById('main').innerHTML=html;
</script></body></html>
