<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>푸른구청 고시 · 공고 열람</title>
<style>
body{font-family:Pretendard,system-ui,sans-serif;background:#F6F7FB;color:#111318;margin:0;padding:24px}
h1{font-size:20px;margin:0 0 10px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input[type=text]{padding:8px;border:1px solid #D1D5DB;border-radius:8px;width:260px}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:#D1FAE5;color:#065F46;font-weight:700}
.badge.up{background:#FEF3C7;color:#92400E}.badge.rep{background:#F3F4F6;color:#6B7280}
.meta{font-size:12px;color:#6B7280}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:12px;font-size:13px}.box h4{margin:0 0 6px;font-size:12px;color:#4B5563}
.none{background:#fff;border:1px dashed #D1D5DB;border-radius:10px;padding:20px;text-align:center;color:#6B7280}
</style></head><body>
<h1>푸른구청 고시 · 공고 열람</h1>
<div class="bar"><select data-testid="category" id="cat"><option value="">전체</option></select>
 <input type="text" data-testid="q" id="q" placeholder="검색어"><button data-testid="search-btn" id="go">검색</button>
 <label><input type="checkbox" data-testid="include-repealed" id="rep"> 폐지 포함</label>
 <span class="meta" data-testid="as-of" id="asof"></span></div>
<div class="wrap"><div><div class="meta" data-testid="count" id="count"></div><div id="list"></div></div><div id="detail"></div></div>
<script>
const $=id=>document.getElementById(id);
async function api(u){const r=await fetch(u);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'오류');return j;}
api('/api/categories').then(c=>{$('cat').innerHTML+=c.map(x=>`<option>${x}</option>`).join('');});
function badge(n){return n.status==='시행 예정'?`<span class="badge up" data-testid="badge">시행 예정 D-${n.days_until}</span>`:n.status==='폐지'?`<span class="badge rep" data-testid="badge">폐지</span>`:`<span class="badge" data-testid="badge">시행 중</span>`;}
async function load(){
  const p=new URLSearchParams({category:$('cat').value,q:$('q').value,include_repealed:$('rep').checked?'1':'0'});
  try{const d=await api('/api/notices?'+p);$('asof').textContent='기준일 '+d.as_of;$('count').textContent=d.count+'건';
    $('list').innerHTML=d.count?d.items.map(n=>`<div class="card" data-testid="notice" data-id="${n.notice_id}" data-status="${n.status}">${badge(n)} <b>${n.title}</b>
      <div class="meta">${n.issuer} · 공고 ${n.published} · 시행 ${n.effective_from} · <a data-testid="source-link" href="${n.source_url}" target="_blank" rel="noopener">원문</a></div></div>`).join(''):'<div class="none" data-testid="no-result">해당 고시 없음</div>';
  }catch(e){$('list').innerHTML='<div class="none">불러오지 못했습니다 <button onclick="load()">다시 시도</button></div>';}
}
$('list').onclick=async e=>{if(e.target.closest('a'))return;const c=e.target.closest('.card');if(!c)return;const n=await api('/api/notices/'+c.dataset.id);
  $('detail').innerHTML=`<div class="detail"><div class="box" data-testid="original"><h4>원문 · ${n.issuer} · 공고 ${n.published}</h4>${n.original}</div>
  <div class="box" data-testid="summary"><h4>요약 — 법적 효력은 원문에 있습니다</h4>${n.has_summary?n.summary:'요약 없음 — 원문을 보세요'}</div></div>`;};
$('go').onclick=load;$('cat').onchange=load;$('rep').onchange=load;load();
</script></body></html>
