<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸른구청 고시 · 공고</title>
<style>
  :root { --blue:#1a56a6; --blue-d:#12407d; --bg:#f4f7fb; --line:#d9e1ec; --txt:#1c2733; --mut:#5d6b7d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--txt); line-height:1.6; }
  header { background:var(--blue); color:#fff; padding:22px 16px; }
  .wrap { max-width:960px; margin:0 auto; }
  header h1 { margin:0; font-size:1.5rem; }
  header p { margin:4px 0 0; opacity:.85; font-size:.92rem; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 12px; }
  .tab { border:1px solid var(--line); background:#fff; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:.95rem; font-family:inherit; }
  .tab[aria-pressed=true] { background:var(--blue); border-color:var(--blue); color:#fff; }
  .tab small { opacity:.7; margin-left:4px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tools input, .tools select { padding:9px 12px; border:1px solid var(--line); border-radius:6px; font-size:.95rem; font-family:inherit; background:#fff; }
  .tools input { flex:1; min-width:200px; }
  .tools button { padding:9px 18px; border:0; background:var(--blue); color:#fff; border-radius:6px; cursor:pointer; font-family:inherit; }
  .tools button:hover { background:var(--blue-d); }
  .count { color:var(--mut); font-size:.9rem; margin:0 0 8px; }
  ul.list { list-style:none; margin:0; padding:0; }
  .item { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .item:hover, .item:focus { border-color:var(--blue); outline:none; }
  .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.82rem; color:var(--mut); }
  .badge { padding:1px 8px; border-radius:10px; font-size:.78rem; font-weight:bold; }
  .b-고시 { background:#e3edfb; color:var(--blue-d); }
  .b-공고 { background:#e5f5ea; color:#1d6b3a; }
  .b-cat { background:#eef0f3; color:#44505f; }
  .item h3 { margin:6px 0 4px; font-size:1.05rem; }
  .item p { margin:0; color:#38475a; font-size:.92rem; }
  .pager { display:flex; justify-content:center; gap:6px; margin:18px 0 40px; }
  .pager button { border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:inherit; }
  .pager button[aria-current=true] { background:var(--blue); color:#fff; border-color:var(--blue); }
  .pager button:disabled { opacity:.4; cursor:default; }
  .empty { text-align:center; padding:50px 0; color:var(--mut); }
  #modal { position:fixed; inset:0; background:rgba(15,25,40,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  #modal.open { display:flex; }
  .sheet { background:#fff; border-radius:10px; max-width:720px; width:100%; max-height:90vh; overflow:auto; padding:24px; }
  .sheet h2 { margin:8px 0 12px; font-size:1.25rem; }
  .info { width:100%; border-collapse:collapse; font-size:.9rem; margin-bottom:14px; }
  .info th { text-align:left; width:90px; background:var(--bg); padding:6px 10px; border:1px solid var(--line); font-weight:normal; color:var(--mut); }
  .info td { padding:6px 10px; border:1px solid var(--line); }
  .view-tabs { display:flex; border-bottom:2px solid var(--line); margin-bottom:12px; }
  .view-tabs button { border:0; background:none; padding:8px 18px; cursor:pointer; font-size:.95rem; font-family:inherit; color:var(--mut); border-bottom:3px solid transparent; margin-bottom:-2px; }
  .view-tabs button[aria-selected=true] { color:var(--blue); border-color:var(--blue); font-weight:bold; }
  .content { white-space:pre-wrap; background:#fafbfd; border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .close { float:right; border:0; background:none; font-size:1.6rem; cursor:pointer; color:var(--mut); }
  footer { text-align:center; color:var(--mut); font-size:.8rem; padding-bottom:30px; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>푸른구청 고시 · 공고</h1>
  <p>주차 · 위생 · 건축 · 복지 분야별 구청 고시와 공고를 찾아보세요.</p>
</div></header>

<main class="wrap">
  <div class="tabs" id="tabs" role="group" aria-label="분야 선택"></div>
  <form class="tools" id="form">
    <input id="q" type="search" placeholder="제목·내용 검색 (예: 과태료, 신청)" aria-label="검색어">
    <select id="kind" aria-label="구분">
      <option value="">고시+공고</option><option>고시</option><option>공고</option>
    </select>
    <select id="sort" aria-label="정렬">
      <option value="latest">최신순</option><option value="views">조회순</option>
    </select>
    <button type="submit">검색</button>
  </form>
  <p class="count" id="count"></p>
  <ul class="list" id="list"></ul>
  <div class="pager" id="pager"></div>
</main>
<footer>※ 이 화면의 모든 고시·공고는 시연용 가상 데이터이며 실제 행정 문서가 아닙니다.</footer>

<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
const state = { category:"", page:1, size:8 };
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
};
const api = async url => {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};

async function loadTabs() {
  const cats = await api("/api/categories");
  const total = cats.reduce((s, c) => s + c.count, 0);
  const items = [{ name:"", label:"전체", count:total }, ...cats.map(c => ({ ...c, label:c.name }))];
  $("tabs").replaceChildren(...items.map(c => {
    const b = el("button", { className:"tab", type:"button" }, c.label, el("small", {}, String(c.count)));
    b.setAttribute("aria-pressed", String(state.category === c.name));
    b.onclick = () => { state.category = c.name; state.page = 1; loadTabs(); loadList(); };
    return b;
  }));
}

async function loadList() {
  const p = new URLSearchParams({ page:state.page, size:state.size, sort:$("sort").value });
  if (state.category) p.set("category", state.category);
  if ($("kind").value) p.set("kind", $("kind").value);
  if ($("q").value.trim()) p.set("q", $("q").value.trim());
  const data = await api("/api/notices?" + p);
  $("count").textContent = `총 ${data.total}건`;
  if (!data.items.length) {
    $("list").replaceChildren(el("li", { className:"empty" }, "조건에 맞는 고시·공고가 없습니다."));
  } else {
    $("list").replaceChildren(...data.items.map(n => {
      const li = el("li", { className:"item", tabIndex:0 },
        el("div", { className:"meta" },
          el("span", { className:"badge b-" + n.kind }, n.kind),
          el("span", { className:"badge b-cat" }, n.category),
          n.number, "· " + n.published, "· 조회 " + n.views),
        el("h3", {}, n.title),
        el("p", {}, n.summary));
      li.onclick = () => openDetail(n.id);
      li.onkeydown = e => { if (e.key === "Enter") openDetail(n.id); };
      return li;
    }));
  }
  renderPager(Math.ceil(data.total / state.size));
}

function renderPager(pages) {
  if (pages <= 1) return $("pager").replaceChildren();
  const btn = (label, page, disabled, current) => {
    const b = el("button", { type:"button", disabled }, label);
    if (current) b.setAttribute("aria-current", "true");
    b.onclick = () => { state.page = page; loadList(); scrollTo(0, 0); };
    return b;
  };
  const nums = Array.from({ length:pages }, (_, i) => btn(String(i + 1), i + 1, false, i + 1 === state.page));
  $("pager").replaceChildren(btn("‹", state.page - 1, state.page === 1), ...nums, btn("›", state.page + 1, state.page === pages));
}

async function openDetail(id) {
  let n;
  try { n = await api("/api/notices/" + id); } catch (e) { return alert(e.message); }
  const row = (k, v) => el("tr", {}, el("th", {}, k), el("td", {}, v));
  const content = el("div", { className:"content" }, n.summary);
  const tabs = [["summary", "요약", n.summary], ["body", "원문", n.body]].map(([key, label, text]) => {
    const b = el("button", { type:"button" }, label);
    b.setAttribute("role", "tab");
    b.onclick = () => { content.textContent = text; tabs.forEach(t => t.setAttribute("aria-selected", String(t === b))); };
    b.setAttribute("aria-selected", String(key === "summary"));
    return b;
  });
  const closeBtn = el("button", { className:"close", type:"button", ariaLabel:"닫기" }, "×");
  closeBtn.onclick = closeModal;
  $("sheet").replaceChildren(
    closeBtn,
    el("div", { className:"meta" },
      el("span", { className:"badge b-" + n.kind }, n.kind),
      el("span", { className:"badge b-cat" }, n.category), n.number),
    el("h2", {}, n.title),
    el("table", { className:"info" },
      row("담당부서", n.department), row("게시일", n.published),
      row("시행·마감", n.effective || "-"), row("조회수", String(n.views))),
    el("div", { className:"view-tabs", role:"tablist" }, ...tabs),
    content);
  $("modal").classList.add("open");
  loadList();
}
function closeModal() { $("modal").classList.remove("open"); }
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.onkeydown = e => { if (e.key === "Escape") closeModal(); };
$("form").onsubmit = e => { e.preventDefault(); state.page = 1; loadList(); };
$("kind").onchange = $("sort").onchange = () => { state.page = 1; loadList(); };

loadTabs(); loadList();
</script>
</body>
</html>
