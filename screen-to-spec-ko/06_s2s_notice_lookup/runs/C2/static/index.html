<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸른구청 고시 · 공고 열람</title>
<style>
body{font-family:"Malgun Gothic",sans-serif;margin:0;color:#222;background:#f5f7fa}
header,main{max-width:1000px;margin:0 auto;padding:12px 16px}
h1{font-size:22px;margin:8px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=text]{padding:6px;width:200px}
#as-of{color:#555;margin:8px 0 2px}
.card{background:#fff;border:1px solid #d8dde3;border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer}
.card h3{margin:4px 0;font-size:16px}
.meta{font-size:13px;color:#555}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff;background:#2e7d32}
[data-status="시행 예정"] .badge{background:#1565c0}
[data-status="폐지"] .badge{background:#757575}
.detail{display:flex;gap:12px;margin:12px 0}
.detail>div{flex:1;background:#fff;border:1px solid #d8dde3;border-radius:6px;padding:10px;white-space:pre-wrap}
.detail .sum{background:#fffbe6}
.detail h4{margin:0 0 6px}
#err,#no-result{padding:12px;color:#a00}
#no-result{color:#555}
</style>
</head>
<body>
<header>
<h1>푸른구청 고시 · 공고 열람</h1>
<div class="bar">
<select data-testid="category" id="category"></select>
<input type="text" data-testid="q" id="q" placeholder="검색어">
<button data-testid="search-btn" id="search">검색</button>
<label><input type="checkbox" data-testid="include-repealed" id="rep"> 폐지 포함</label>
</div>
<div id="as-of" data-testid="as-of"></div>
</header>
<main>
<div id="err" hidden>불러오지 못했습니다 <button id="retry">다시 시도</button></div>
<div id="count" data-testid="count"></div>
<div id="no-result" data-testid="no-result" hidden>해당 고시 없음</div>
<div id="list"></div>
<div id="detail"></div>
</main>
<script>
const $ = id => document.getElementById(id);
function el(tag, props, text) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  if (text !== undefined) e.textContent = text;
  return e;
}
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadCategories() {
  const sel = $("category");
  sel.append(el("option", {value: ""}, "전체"));
  try { (await getJSON("/api/categories")).forEach(c => sel.append(el("option", {value: c}, c))); }
  catch (e) { /* 목록 호출에서 오류 표시 */ }
}
async function load() {
  const p = new URLSearchParams({category: $("category").value, q: $("q").value.trim(),
    include_repealed: $("rep").checked ? "1" : "0"});
  $("detail").replaceChildren();
  try {
    const d = await getJSON("/api/notices?" + p);
    $("err").hidden = true;
    $("as-of").textContent = "기준일 " + d.as_of;
    $("count").textContent = "총 " + d.count + "건";
    $("no-result").hidden = d.count !== 0;
    $("list").replaceChildren(...d.items.map(card));
  } catch (e) {
    $("err").hidden = false;
    $("list").replaceChildren();
    $("count").textContent = "";
    $("no-result").hidden = true;
  }
}
function card(n) {
  const c = el("div", {className: "card"});
  c.dataset.testid = "notice"; c.dataset.id = n.notice_id; c.dataset.status = n.status;
  const b = el("span", {className: "badge"}, n.status === "시행 예정" ? "시행 예정 D-" + n.days_until : n.status);
  b.dataset.testid = "badge";
  const a = el("a", {href: n.source_url, target: "_blank", rel: "noopener"}, "원문");
  a.dataset.testid = "source-link";
  a.addEventListener("click", ev => ev.stopPropagation());
  c.append(b, el("h3", {}, n.title),
    el("div", {className: "meta"}, n.issuer + " · 공고 " + n.published + " · 시행 " + n.effective_from), a);
  c.addEventListener("click", () => showDetail(n.notice_id));
  return c;
}
async function showDetail(id) {
  try {
    const n = await getJSON("/api/notices/" + encodeURIComponent(id));
    const o = el("div"); o.dataset.testid = "original";
    o.append(el("h4", {}, "원문"), document.createTextNode(n.original));
    const s = el("div", {className: "sum"}); s.dataset.testid = "summary";
    s.append(el("h4", {}, "요약 — 법적 효력은 원문에 있습니다"),
      document.createTextNode(n.has_summary ? n.summary : "요약 없음 — 원문을 보세요"));
    const w = el("div", {className: "detail"}); w.append(o, s);
    $("detail").replaceChildren(w);
    w.scrollIntoView();
  } catch (e) {
    $("err").hidden = false;
  }
}
$("search").addEventListener("click", load);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
$("category").addEventListener("change", load);
$("rep").addEventListener("change", load);
$("retry").addEventListener("click", load);
loadCategories().then(load);
</script>
</body>
</html>
