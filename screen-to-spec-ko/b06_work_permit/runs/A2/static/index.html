<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뚝딱건설 위험 작업 허가서</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#f3f4f6;color:#1f2937}
header{background:#1f2937;color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}select,input,textarea,button{font:inherit;padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px}
button{cursor:pointer;background:#2563eb;color:#fff;border:0}button.g{background:#64748b}button.r{background:#dc2626}button.ok{background:#16a34a}
main{max-width:1100px;margin:16px auto;padding:0 12px}.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.s-submitted{background:#f59e0b}.s-reviewed{background:#0ea5e9}.s-approved{background:#16a34a}.s-in_progress{background:#7c3aed}.s-completed{background:#6b7280}.s-rejected{background:#dc2626}
.t{font-weight:bold;padding:1px 6px;border-radius:4px;background:#e5e7eb;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.zone{border-left:5px solid #94a3b8}.zone.hot{border-left-color:#7c3aed}.zone h3{margin:0 0 8px;font-size:15px}
.mini{font-size:13px;border-top:1px solid #eee;padding:6px 0}.sum span{margin-right:10px}
form label{display:block;margin:6px 0 2px;font-size:13px}form input,form select,form textarea{width:100%}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;display:none;z-index:9}
dialog{border:0;border-radius:10px;max-width:520px;width:92%}small{color:#64748b}
</style></head><body>
<header><h1>🦺 뚝딱건설 위험 작업 허가서</h1>
<label>사용자 <select id="who"></select></label></header>
<main id="app"></main><div id="msg"></div>
<dialog id="dlg"></dialog>
<script>
const ST={submitted:'안전 검토 대기',reviewed:'승인 대기',approved:'승인(시작 가능)',in_progress:'작업 중',completed:'종료',rejected:'반려'};
let me=null,users=[],meta=null,tab='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,method='GET',body){
  const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-User-Id':me?.id||''},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){toast(j.detail||'오류',1);throw new Error(j.detail)}return j}
function toast(t,err){const m=$('#msg');m.textContent=t;m.style.background=err?'#dc2626':'#16a34a';m.style.display='block';setTimeout(()=>m.style.display='none',3000)}
const badge=s=>`<span class="badge s-${s}">${ST[s]}</span>`;
async function init(){
  users=await (await fetch('/api/users')).json();meta=await (await fetch('/api/meta')).json();
  const roleK={foreman:'작업반장',safety:'안전 담당',manager:'현장 책임자'};
  $('#who').innerHTML=users.map(u=>`<option value="${u.id}">${roleK[u.role]} · ${u.name} (${u.team})</option>`).join('');
  $('#who').onchange=()=>{me=users.find(u=>u.id==$('#who').value);tab='';render()};
  me=users[0];render();setInterval(()=>{if(!$('#dlg').open&&!document.activeElement.closest('form'))render(true)},15000)}
async function render(){
  if(me.role==='foreman')return foreman();
  if(!tab)tab='board';
  const tabs=`<div class="row" style="margin-bottom:12px"><button class="${tab==='board'?'':'g'}" onclick="tab='board';render()">오늘 구역별 현황판</button>
  <button class="${tab==='list'?'':'g'}" onclick="tab='list';render()">${me.role==='safety'?'안전 검토':'승인'} 대기 목록</button></div>`;
  $('#app').innerHTML=tabs+'<div id="body"></div>';
  tab==='board'?board():queue()}
async function board(){
  const b=await api('/board');const c=b.counts;
  $('#body').innerHTML=`<div class="card sum"><b>${b.date} 허가 현황</b> &nbsp;`+Object.keys(ST).map(k=>`<span>${badge(k)} ${c[k]||0}</span>`).join('')+`</div><div class="grid">`+
  b.zones.map(z=>{const hot=z.permits.some(p=>p.status==='in_progress');return `<div class="card zone ${hot?'hot':''}"><h3>${esc(z.zone)} ${hot?'🔴 작업 중':''}</h3>`+
  (z.permits.length?z.permits.map(p=>`<div class="mini"><span class="t">${p.type}</span> ${esc(p.description)} ${badge(p.status)}<br><small>${p.start_time}~${p.end_time} · ${esc(p.foreman_name)}(${esc(p.foreman_team)}) · ${p.workers}명${p.o2!=null?' · O₂ '+p.o2+'%':''}</small></div>`).join(''):'<small>오늘 허가 없음</small>')+`</div>`}).join('')+`</div>`}
async function queue(){
  const want=me.role==='safety'?'submitted':'reviewed';
  const l=(await api('/permits')).filter(p=>p.status===want);
  $('#body').innerHTML=l.length?l.map(p=>`<div class="card row"><div class="grow"><span class="t">${p.type}</span> <b>${esc(p.zone)}</b> — ${esc(p.description)}<br><small>${p.work_date} ${p.start_time}~${p.end_time} · ${esc(p.foreman_name)}(${esc(p.foreman_team)}) · ${p.workers}명${p.o2!=null?' · O₂ '+p.o2+'%':''}${p.review_note?' · 검토: '+esc(p.review_note):''}</small></div>
  <button onclick="${me.role==='safety'?'reviewDlg':'decideDlg'}(${p.id})">${me.role==='safety'?'검토':'승인 처리'}</button></div>`).join(''):'<div class="card">대기 중인 건이 없습니다.</div>'}
async function reviewDlg(id){
  const p=await api('/permits/'+id);
  $('#dlg').innerHTML=`<form onsubmit="return false"><h3>안전 검토 #${id} · ${p.type} / ${esc(p.zone)}</h3><p>${esc(p.description)}</p>
  ${p.checklist.map((t,i)=>`<label><input type="checkbox" class="ck" value="${i}" style="width:auto"> ${t}</label>`).join('')}
  ${p.type==='밀폐'?'<label>산소 농도 (%) — 적정 19.5~23.5</label><input id="o2" type="number" step="0.1">':''}
  <label>의견 / 반려 사유</label><textarea id="note" rows="2"></textarea>
  <div class="row" style="margin-top:10px"><button class="ok" onclick="doReview(${id},true)">적합</button><button class="r" onclick="doReview(${id},false)">반려</button><button class="g" onclick="$('#dlg').close()">닫기</button></div></form>`;$('#dlg').showModal()}
async function doReview(id,ok){
  const o=$('#o2');await api(`/permits/${id}/review`,'POST',{ok,note:$('#note').value,checked:[...document.querySelectorAll('.ck:checked')].map(x=>+x.value),o2:o&&o.value!==''?+o.value:null});
  $('#dlg').close();toast(ok?'적합 처리됨':'반려됨');render()}
async function decideDlg(id){
  const p=await api('/permits/'+id);
  $('#dlg').innerHTML=`<form onsubmit="return false"><h3>승인 #${id} · ${p.type} / ${esc(p.zone)}</h3><p>${esc(p.description)}<br><small>${p.work_date} ${p.start_time}~${p.end_time} · ${p.workers}명<br>안전 검토(${esc(p.reviewer_name)}): ${esc(p.review_note)}${p.o2!=null?' · O₂ '+p.o2+'%':''}</small></p>
  <label>의견 / 반려 사유</label><textarea id="note" rows="2"></textarea>
  <div class="row" style="margin-top:10px"><button class="ok" onclick="doDecide(${id},true)">승인</button><button class="r" onclick="doDecide(${id},false)">반려</button><button class="g" onclick="$('#dlg').close()">닫기</button></div></form>`;$('#dlg').showModal()}
async function doDecide(id,ok){await api(`/permits/${id}/decide`,'POST',{ok,note:$('#note').value});$('#dlg').close();toast(ok?'승인됨':'반려됨');render()}
async function foreman(){
  const l=await api('/permits');const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  $('#app').innerHTML=`<div class="card"><b>새 허가 신청</b><form id="nf" onsubmit="return false"><div class="row">
  <div class="grow"><label>작업 종류</label><select name="type">${Object.keys(meta.types).map(t=>`<option>${t}</option>`).join("")}</select></div>
  <div class="grow"><label>구역</label><select name="zone">${meta.zones.map(z=>`<option>${z}</option>`).join("")}</select></div>
  <div class="grow"><label>작업일</label><input name="work_date" type="date" value="${today}" min="${today}"></div>
  <div class="grow"><label>시작</label><input name="start_time" type="time" value="09:00"></div>
  <div class="grow"><label>종료</label><input name="end_time" type="time" value="12:00"></div>
  <div class="grow"><label>인원</label><input name="workers" type="number" min="1" value="2"></div></div>
  <label>작업 내용</label><input name="description"><div style="margin-top:8px"><button onclick="submitNew()">신청</button></div></form></div>
  <h3>내 허가서</h3>`+(l.length?l.map(p=>{
    const canStart=p.status==='approved'&&p.work_date===today;
    return `<div class="card row"><div class="grow"><span class="t">${p.type}</span> <b>${esc(p.zone)}</b> — ${esc(p.description)} ${badge(p.status)}<br>
    <small>${p.work_date} ${p.start_time}~${p.end_time} · ${p.workers}명${p.status==='rejected'?' · <b style="color:#dc2626">반려: '+esc(p.decision_note||p.review_note)+'</b>':''}${p.started_at?' · 시작 '+p.started_at.slice(11,16):''}${p.ended_at?' · 종료 '+p.ended_at.slice(11,16):''}</small></div>
    ${p.status==='in_progress'?`<button class="r" onclick="act(${p.id},'finish')">작업 종료</button>`:
      `<button ${canStart?'':'disabled style="opacity:.4;cursor:not-allowed"'} onclick="act(${p.id},'start')" title="${canStart?'':'승인 후 작업일에만 시작할 수 있습니다'}">작업 시작</button>`}
    <button class="g" onclick="hist(${p.id})">이력</button></div>`}).join(''):'<div class="card">허가서가 없습니다.</div>')}
async function submitNew(){const f=new FormData($('#nf'));const b=Object.fromEntries(f);b.workers=+b.workers;await api('/permits','POST',b);toast('신청되었습니다');render()}
async function act(id,a){await api(`/permits/${id}/${a}`,'POST');toast(a==='start'?'작업을 시작했습니다':'작업을 종료했습니다');render()}
async function hist(id){const p=await api('/permits/'+id);
  $('#dlg').innerHTML=`<h3>이력 #${id}</h3>`+p.logs.map(l=>`<div class="mini">${l.at.slice(5,16)} · ${esc(l.who)} · ${esc(l.action)}</div>`).join('')+`<div style="margin-top:10px"><button class="g" onclick="$('#dlg').close()">닫기</button></div>`;$('#dlg').showModal()}
init();
</script></body></html>
