<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 오늘의 현황판</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 24px; background: #f5f6f8; color: #222; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; }
  #updated-at { color: #666; font-size: 14px; }
  #cards { display: flex; gap: 16px; margin-bottom: 24px; }
  .card, #error, #chart { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card { flex: 1; }
  #error { margin-bottom: 24px; }
  .label { font-size: 14px; color: #555; }
  .value { font-size: 40px; font-weight: bold; margin-top: 8px; }
  #bars { display: flex; gap: 12px; align-items: flex-end; height: 180px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar { width: 60%; background: #3b7ddd; }
  .cnt { font-size: 13px; margin-bottom: 4px; }
  .dates { display: flex; gap: 12px; }
  .date { flex: 1; text-align: center; font-size: 12px; color: #555; margin-top: 6px; }
  #empty-notice { color: #666; padding: 40px 0; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>가나다식품 오늘의 현황판</h1>
  <div id="updated-at" data-testid="updated-at"></div>
</header>

<div id="cards">
  <div class="card"><div class="label">오늘 주문</div><div class="value" data-testid="today-orders">—</div></div>
  <div class="card"><div class="label">재고 경고</div><div class="value" data-testid="stock-alerts">—</div></div>
  <div class="card"><div class="label">미처리 문의</div><div class="value" data-testid="open-inquiries">—</div></div>
</div>
<div id="error" hidden>불러오지 못했습니다 <button id="retry" type="button">다시 시도</button></div>

<section id="chart">
  <div id="bars"></div>
  <div class="dates" id="dates"></div>
  <div id="empty-notice" data-testid="empty-notice" hidden>데이터 없음</div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const tids = { today_orders: "today-orders", stock_alerts: "stock-alerts", open_inquiries: "open-inquiries" };

function render(d) {
  $("#error").hidden = true;
  $("#cards").hidden = false;
  for (const k in tids) {
    $('[data-testid="' + tids[k] + '"]').textContent = d.empty ? "—" : String(d[k]);
  }
  $("#updated-at").textContent = "갱신 " + d.updated_at;
  const bars = $("#bars"), dates = $("#dates");
  bars.innerHTML = "";
  dates.innerHTML = "";
  $("#empty-notice").hidden = !d.empty;
  if (d.empty) return;
  const max = Math.max(1, ...d.daily_orders.map((x) => x.count));
  for (const x of d.daily_orders) {
    const col = document.createElement("div");
    col.className = "col";
    const cnt = document.createElement("div");
    cnt.className = "cnt";
    cnt.textContent = x.count;
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.setAttribute("data-testid", "daily-bar");
    bar.style.height = Math.round((x.count / max) * 140) + "px";
    col.append(cnt, bar);
    bars.appendChild(col);
    const dd = document.createElement("div");
    dd.className = "date";
    dd.textContent = x.date.slice(5);
    dates.appendChild(dd);
  }
}

async function load() {
  try {
    const r = await fetch("/api/summary", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("#cards").hidden = true;
    $("#error").hidden = false;
  }
}
$("#retry").addEventListener("click", load);
load();
</script>
</body>
</html>
