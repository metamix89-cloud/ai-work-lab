<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 오늘의 현황판</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 22px; margin: 0; }
  #updated-at { color: #666; font-size: 14px; }
  .cards { display: flex; gap: 16px; margin: 24px 0; }
  .card { flex: 1; background: #fff; border-radius: 8px; padding: 20px; text-align: center; box-shadow: 0 1px 3px #0002; }
  .label { font-size: 15px; color: #555; }
  .num { font-size: 44px; font-weight: bold; margin-top: 8px; }
  .chart { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px #0002; }
  .bars { display: flex; gap: 12px; align-items: flex-end; height: 180px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar { width: 100%; background: #3b7dd8; border-radius: 3px 3px 0 0; }
  .cnt { font-size: 13px; margin-bottom: 4px; }
  .dates { display: flex; gap: 12px; margin-top: 6px; }
  .dates span { flex: 1; text-align: center; font-size: 13px; color: #555; }
  #empty-notice { text-align: center; color: #888; padding: 60px 0; }
  #error { background: #fff; border-radius: 8px; padding: 24px; text-align: center; margin: 24px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>가나다식품 오늘의 현황판</h1>
    <span id="updated-at" data-testid="updated-at"></span>
  </header>
  <div id="error" hidden>불러오지 못했습니다 <button id="retry">다시 시도</button></div>
  <section class="cards" id="cards">
    <div class="card"><div class="label">오늘 주문</div><div class="num" data-testid="today-orders">—</div></div>
    <div class="card"><div class="label">재고 경고</div><div class="num" data-testid="stock-alerts">—</div></div>
    <div class="card"><div class="label">미처리 문의</div><div class="num" data-testid="open-inquiries">—</div></div>
  </section>
  <section class="chart" id="chart">
    <div class="label" style="margin-bottom:12px">최근 7일 주문 수</div>
    <div id="empty-notice" data-testid="empty-notice" hidden>데이터 없음</div>
    <div id="bars-wrap">
      <div class="bars" id="bars"></div>
      <div class="dates" id="dates"></div>
    </div>
  </section>
</main>
<script>
const q = (s) => document.querySelector(s);
const setNum = (id, v) => { q('[data-testid="' + id + '"]').textContent = v; };

async function load() {
  q('#error').hidden = true;
  try {
    const r = await fetch('/api/summary', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    q('#cards').hidden = true;
    q('#chart').hidden = true;
    q('#error').hidden = false;
  }
}

function render(d) {
  q('#cards').hidden = false;
  q('#chart').hidden = false;
  q('#updated-at').textContent = '갱신 ' + d.updated_at;
  const empty = d.empty;
  setNum('today-orders', empty ? '—' : d.today_orders);
  setNum('stock-alerts', empty ? '—' : d.stock_alerts);
  setNum('open-inquiries', empty ? '—' : d.open_inquiries);
  q('#empty-notice').hidden = !empty;
  q('#bars-wrap').hidden = empty;
  const bars = q('#bars'), dates = q('#dates');
  bars.innerHTML = ''; dates.innerHTML = '';
  if (empty) return;
  const max = Math.max(1, ...d.daily_orders.map(x => x.count));
  for (const x of d.daily_orders) {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = '<div class="cnt"></div><div class="bar" data-testid="daily-bar"></div>';
    col.firstChild.textContent = x.count;
    col.lastChild.style.height = (x.count / max * 140) + 'px';
    bars.appendChild(col);
    const s = document.createElement('span');
    s.textContent = x.date.slice(5);
    dates.appendChild(s);
  }
}

q('#retry').addEventListener('click', load);
load();
</script>
</body>
</html>
