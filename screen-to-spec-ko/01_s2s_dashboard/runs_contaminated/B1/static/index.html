<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 오늘의 현황판</title>
<style>
  body { margin: 0; font-family: "Pretendard", "Malgun Gothic", sans-serif; background: #f5f6f8; color: #1d2330; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0; }
  #updated-at { color: #667085; font-size: 14px; }
  #cards { display: flex; gap: 16px; }
  .card { flex: 1; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .label { color: #667085; font-size: 14px; }
  .value { font-size: 48px; font-weight: 700; margin-top: 8px; }
  #error { background: #fff; border-radius: 10px; padding: 20px; text-align: center; }
  #chart { margin-top: 16px; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #chart h2 { font-size: 16px; margin: 0 0 12px; }
  #bars { display: flex; gap: 12px; align-items: flex-end; height: 200px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar { width: 100%; background: #4f6ef7; border-radius: 4px 4px 0 0; }
  .cnt { font-size: 13px; margin-bottom: 4px; }
  .date { text-align: center; font-size: 13px; color: #667085; margin-top: 6px; }
  #empty-notice { text-align: center; color: #667085; padding: 80px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>가나다식품 오늘의 현황판</h1>
    <div id="updated-at" data-testid="updated-at"></div>
  </header>

  <section id="cards">
    <div class="card"><div class="label">오늘 주문</div><div class="value" data-testid="today-orders">—</div></div>
    <div class="card"><div class="label">재고 경고</div><div class="value" data-testid="stock-alerts">—</div></div>
    <div class="card"><div class="label">미처리 문의</div><div class="value" data-testid="open-inquiries">—</div></div>
  </section>
  <section id="error" hidden>
    <p>불러오지 못했습니다</p>
    <button id="retry" type="button">다시 시도</button>
  </section>

  <section id="chart">
    <h2>최근 7일 주문</h2>
    <div id="bars"></div>
    <div id="empty-notice" data-testid="empty-notice" hidden>데이터 없음</div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const TIDS = ["today-orders", "stock-alerts", "open-inquiries"];
const KEYS = ["today_orders", "stock_alerts", "open_inquiries"];

function setNumbers(data) {
  TIDS.forEach((t, i) => {
    const v = data[KEYS[i]];
    $('[data-testid="' + t + '"]').textContent = v === null || v === undefined ? "—" : String(v);
  });
}

function drawBars(days) {
  const max = Math.max(1, ...days.map((d) => d.count));
  $("#bars").innerHTML = days.map((d) =>
    '<div class="col"><div class="cnt">' + d.count + '</div>' +
    '<div class="bar" data-testid="daily-bar" style="height:' + (d.count / max * 150) + 'px"></div>' +
    '<div class="date">' + d.date.slice(5) + '</div></div>').join("");
}

async function load() {
  try {
    const r = await fetch("/api/summary", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    $("#error").hidden = true;
    $("#cards").hidden = false;
    $("#chart").hidden = false;
    $("#updated-at").textContent = "갱신 " + data.updated_at;
    setNumbers(data);
    $("#empty-notice").hidden = !data.empty;
    $("#bars").hidden = data.empty;
    if (!data.empty) drawBars(data.daily_orders);
  } catch (e) {
    $("#cards").hidden = true;
    $("#chart").hidden = true;
    $("#error").hidden = false;
  }
}
$("#retry").addEventListener("click", load);
load();
</script>
</body>
</html>
