<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 오늘의 현황판</title>
<style>
  body { font-family: "Pretendard", "Malgun Gothic", sans-serif; margin: 0; background: #f5f6f8; color: #1d2330; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 22px; margin: 0; }
  #updated-at { color: #667085; font-size: 14px; }
  #cards { display: flex; gap: 16px; margin: 24px 0; }
  .card { flex: 1; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .label { color: #667085; font-size: 14px; }
  .num { font-size: 40px; font-weight: 700; margin-top: 8px; }
  #chart-box { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #chart { display: flex; gap: 12px; align-items: flex-end; height: 180px; margin-top: 12px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar { width: 100%; background: #3b6fd8; border-radius: 4px 4px 0 0; }
  .cnt { font-size: 12px; color: #667085; margin-bottom: 2px; }
  #dates { display: flex; gap: 12px; margin-top: 6px; }
  #dates span { flex: 1; text-align: center; font-size: 12px; color: #667085; }
  #empty-notice, #error { text-align: center; color: #667085; padding: 40px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>가나다식품 오늘의 현황판</h1>
    <span id="updated-at" data-testid="updated-at"></span>
  </header>
  <section id="cards">
    <div class="card"><div class="label">오늘 주문</div><div class="num" data-testid="today-orders">—</div></div>
    <div class="card"><div class="label">재고 경고</div><div class="num" data-testid="stock-alerts">—</div></div>
    <div class="card"><div class="label">미처리 문의</div><div class="num" data-testid="open-inquiries">—</div></div>
  </section>
  <section id="error" hidden>
    <div>불러오지 못했습니다</div>
    <button id="retry" type="button">다시 시도</button>
  </section>
  <section id="chart-box">
    <div class="label">최근 7일 주문 수</div>
    <div id="chart"></div>
    <div id="dates"></div>
    <div id="empty-notice" data-testid="empty-notice" hidden>데이터 없음</div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const ids = { today_orders: "today-orders", stock_alerts: "stock-alerts", open_inquiries: "open-inquiries" };

function setNums(data) {
  for (const [key, tid] of Object.entries(ids)) {
    $(`[data-testid="${tid}"]`).textContent = data ? String(data[key]) : "—";
  }
}

function render(data) {
  $("#error").hidden = true;
  $("#cards").hidden = false;
  $("#chart-box").hidden = false;
  $("#updated-at").textContent = "갱신 " + data.updated_at;
  const chart = $("#chart"), dates = $("#dates"), notice = $("#empty-notice");
  chart.innerHTML = "";
  dates.innerHTML = "";
  if (data.empty) {
    setNums(null);
    notice.hidden = false;
    return;
  }
  notice.hidden = true;
  setNums(data);
  const max = Math.max(1, ...data.daily_orders.map((d) => d.count));
  for (const d of data.daily_orders) {
    const col = document.createElement("div");
    col.className = "col";
    const cnt = document.createElement("div");
    cnt.className = "cnt";
    cnt.textContent = d.count;
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.setAttribute("data-testid", "daily-bar");
    bar.style.height = (d.count / max * 140) + "px";
    col.append(cnt, bar);
    chart.append(col);
    const s = document.createElement("span");
    s.textContent = d.date.slice(5);
    dates.append(s);
  }
}

async function load() {
  try {
    const r = await fetch("/api/summary", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("#cards").hidden = true;
    $("#chart-box").hidden = true;
    $("#error").hidden = false;
  }
}
$("#retry").addEventListener("click", load);
load();
</script>
</body>
</html>
