<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 오늘의 현황판</title>
<style>
  body { font-family: "Pretendard", "Malgun Gothic", sans-serif; margin: 0; background: #f5f6f8; color: #1d2330; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 24px; margin: 0; }
  #updated-at { color: #667; font-size: 14px; }
  .cards { display: flex; gap: 16px; margin: 24px 0; }
  .card { flex: 1; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .label { font-size: 14px; color: #667; }
  .num { font-size: 48px; font-weight: 700; margin-top: 8px; }
  .chart { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .chart h2 { font-size: 16px; margin: 0 0 12px; }
  .bars { display: flex; gap: 12px; align-items: flex-end; height: 180px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar { width: 100%; background: #4f6ef7; border-radius: 4px 4px 0 0; }
  .cnt { font-size: 13px; margin-bottom: 4px; }
  .dates { display: flex; gap: 12px; margin-top: 6px; }
  .dates span { flex: 1; text-align: center; font-size: 12px; color: #667; }
  #empty-notice { color: #667; text-align: center; padding: 60px 0; }
  #error { background: #fff; border-radius: 8px; padding: 24px; text-align: center; margin: 24px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>가나다식품 오늘의 현황판</h1>
    <div id="updated-at" data-testid="updated-at"></div>
  </header>
  <div id="error" hidden>
    <p>불러오지 못했습니다</p>
    <button id="retry" type="button">다시 시도</button>
  </div>
  <section class="cards" id="cards">
    <div class="card"><div class="label">오늘 주문</div><div class="num" data-testid="today-orders">—</div></div>
    <div class="card"><div class="label">재고 경고</div><div class="num" data-testid="stock-alerts">—</div></div>
    <div class="card"><div class="label">미처리 문의</div><div class="num" data-testid="open-inquiries">—</div></div>
  </section>
  <section class="chart" id="chart">
    <h2>최근 7일 주문</h2>
    <div id="empty-notice" data-testid="empty-notice" hidden>데이터 없음</div>
    <div id="graph">
      <div class="bars" id="bars"></div>
      <div class="dates" id="dates"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const TIDS = { today_orders: "today-orders", stock_alerts: "stock-alerts", open_inquiries: "open-inquiries" };

function render(d) {
  $("error").hidden = true;
  $("cards").hidden = false;
  $("chart").hidden = false;
  $("updated-at").textContent = "갱신 " + d.updated_at;
  for (const k in TIDS) {
    document.querySelector('[data-testid="' + TIDS[k] + '"]').textContent = d.empty ? "—" : String(d[k]);
  }
  const bars = $("bars"), dates = $("dates");
  bars.innerHTML = "";
  dates.innerHTML = "";
  $("empty-notice").hidden = !d.empty;
  $("graph").hidden = d.empty;
  if (d.empty) return;
  const max = Math.max(1, ...d.daily_orders.map((x) => x.count));
  for (const x of d.daily_orders) {
    const col = document.createElement("div");
    col.className = "col";
    const cnt = document.createElement("div");
    cnt.className = "cnt";
    cnt.textContent = x.count;
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.dataset.testid = "daily-bar";
    bar.style.height = (x.count / max * 140) + "px";
    col.append(cnt, bar);
    bars.appendChild(col);
    const s = document.createElement("span");
    s.textContent = x.date.slice(5);
    dates.appendChild(s);
  }
}

async function load() {
  try {
    const r = await fetch("/api/summary", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("cards").hidden = true;
    $("chart").hidden = true;
    $("error").hidden = false;
  }
}
$("retry").addEventListener("click", load);
load();
</script>
</body>
</html>
