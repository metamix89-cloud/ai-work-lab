<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온소프트 사내 소식 피드</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; color: #222; background: #fafafa; }
  h1 { font-size: 20px; }
  .bar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  textarea { width: 100%; box-sizing: border-box; height: 64px; padding: 8px; }
  button { cursor: pointer; padding: 4px 10px; }
  #message { min-height: 22px; color: #b00020; margin: 6px 0; }
  .post { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
  .post[data-pinned="1"] { border-color: #2563eb; background: #f3f7ff; }
  .meta { font-size: 12px; color: #666; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { color: #fff; background: #2563eb; border-radius: 3px; padding: 0 5px; }
  .hid { color: #b00020; }
  .body { white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
  .actions { display: flex; gap: 6px; }
  #more, #error { display: none; margin: 12px 0; }
</style>
</head>
<body>
<h1>다온소프트 사내 소식</h1>
<div class="bar"><label for="user">사용자</label><select data-testid="user" id="user"></select></div>
<textarea data-testid="compose" id="compose" placeholder="소식을 남겨 보세요 (1~500자)"></textarea>
<div class="bar"><button data-testid="submit" id="submit">올리기</button></div>
<div data-testid="message" id="message"></div>
<div id="error"><span>불러오지 못했습니다</span> <button data-testid="retry" id="retry">다시 시도</button></div>
<div id="feed"></div>
<button data-testid="more" id="more">더 보기</button>
<script>
const $ = (id) => document.getElementById(id);
let users = [], cursor = null;

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error((data && data.detail) || "오류"); err.api = true; throw err; }
  return data;
}

const me = () => users.find((u) => u.user_id === $("user").value);
const say = (t) => { $("message").textContent = t || ""; };

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function button(label, testid, handler) {
  const b = el("button", label);
  b.dataset.testid = testid;
  b.addEventListener("click", handler);
  return b;
}

async function act(fn) {
  try { await fn(); say(""); } catch (e) { say(e.message); return; }
  load();
}

function renderPost(p) {
  const u = me();
  const box = el("div", undefined, "post");
  box.dataset.testid = "post";
  box.dataset.id = p.post_id;
  box.dataset.pinned = p.pinned ? "1" : "0";
  const meta = el("div", undefined, "meta");
  if (p.pinned) meta.append(el("span", "공지", "badge"));
  meta.append(el("span", p.author_name), el("span", p.created_at), el("span", "댓글 " + p.comment_count));
  if (p.hidden) meta.append(el("span", "신고로 숨김", "hid"));
  box.append(meta, el("div", p.body, "body"));
  const actions = el("div", undefined, "actions");
  const admin = u && u.role === "admin";
  if (u && (admin || u.user_id === p.author_id))
    actions.append(button("삭제", "delete", () => act(() => api("DELETE", "/api/posts/" + p.post_id, { user: u.user_id }))));
  if (admin)
    actions.append(button(p.pinned ? "고정 해제" : "고정", "pin", () => act(() => api("POST", "/api/posts/" + p.post_id + "/pin", { user: u.user_id, pinned: !p.pinned }))));
  if (u && u.user_id !== p.author_id)
    actions.append(button("신고", "report", () => act(() => api("POST", "/api/posts/" + p.post_id + "/reports", { user: u.user_id }))));
  box.append(actions);
  return box;
}

function showMore(c) {
  cursor = c;
  $("more").style.display = c ? "inline-block" : "none";
}

async function load() {
  $("error").style.display = "none";
  try {
    const d = await api("GET", "/api/posts?viewer=" + encodeURIComponent($("user").value));
    const feed = $("feed");
    feed.replaceChildren(...d.pinned.map(renderPost), ...d.posts.map(renderPost));
    showMore(d.next_cursor);
  } catch (e) {
    $("feed").replaceChildren();
    showMore(null);
    $("error").style.display = "block";
  }
}

async function loadMore() {
  try {
    const d = await api("GET", "/api/posts?viewer=" + encodeURIComponent($("user").value) + "&before=" + encodeURIComponent(cursor));
    $("feed").append(...d.posts.map(renderPost));
    showMore(d.next_cursor);
  } catch (e) {
    $("error").style.display = "block";
  }
}

async function init() {
  try {
    users = await api("GET", "/api/users");
    $("user").replaceChildren(...users.map((u) => { const o = el("option", u.name + (u.role === "admin" ? " (운영자)" : "")); o.value = u.user_id; return o; }));
  } catch (e) {
    $("error").style.display = "block";
    return;
  }
  load();
}

$("user").addEventListener("change", () => { say(""); load(); });
$("more").addEventListener("click", loadMore);
$("retry").addEventListener("click", () => (users.length ? load() : init()));
$("submit").addEventListener("click", async () => {
  try {
    await api("POST", "/api/posts", { user: $("user").value, body: $("compose").value });
    $("compose").value = "";
    say("");
  } catch (e) { say(e.message); return; }
  load();
});
init();
</script>
</body>
</html>
