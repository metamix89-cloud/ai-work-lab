<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다온소프트 온보딩 교육</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 24px auto; padding: 0 12px; color: #222; }
  h1 { font-size: 22px; }
  .lesson { border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; margin: 6px 0; display: flex; justify-content: space-between; align-items: center; }
  .lesson[data-state="done"] { background: #eef8ee; }
  .lesson[data-state="locked"] { color: #999; background: #f5f5f5; }
  .q { margin: 10px 0; }
  .q label { display: block; margin-left: 12px; }
  #message { min-height: 1.4em; color: #b00020; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
</style>
</head>
<body>
<h1>다온소프트 온보딩 교육</h1>
<div>사용자: <select data-testid="user-select" id="user-select"></select></div>
<div id="message" data-testid="message"></div>
<div id="error" hidden>불러오지 못했습니다 <button id="retry">다시 시도</button></div>
<div id="view"></div>
<script>
let users = [], quizItems = null, lastResult = null, current = '';

const $ = (id) => document.getElementById(id);
function el(tag, props, text) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  if (text !== undefined) e.textContent = text;
  return e;
}
function say(t) { $('message').textContent = t || ''; }

async function api(method, url, body) {
  const r = await fetch(url, {
    method, headers: body ? {'Content-Type': 'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined
  });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.detail) || '요청 실패'); err.rejected = true; throw err; }
  return data;
}

function fail(e) {
  if (e && e.rejected) { say(e.message); return; }
  $('error').hidden = false;
  $('view').innerHTML = '';
}

async function load() {
  $('error').hidden = true;
  try {
    if (!users.length) {
      users = await api('GET', '/api/users');
      const sel = $('user-select');
      sel.innerHTML = '';
      sel.appendChild(el('option', {value: ''}, '-- 선택 --'));
      users.forEach(u => sel.appendChild(el('option', {value: u.user}, u.user)));
      sel.value = current;
    }
    await render();
  } catch (e) { fail(e); }
}

async function render() {
  const view = $('view');
  const u = users.find(x => x.user === current);
  if (!u) { view.innerHTML = ''; return; }
  if (u.role === 'admin') return renderAdmin(view);
  return renderTrainee(view);
}

async function renderAdmin(view) {
  const rows = await api('GET', '/api/admin/incomplete?viewer=' + encodeURIComponent(current));
  view.innerHTML = '';
  view.appendChild(el('h2', {}, '미수료자 목록'));
  const t = el('table');
  const head = el('tr');
  ['이름', '진도율', '응시 횟수', '최고 점수'].forEach(h => head.appendChild(el('th', {}, h)));
  t.appendChild(head);
  rows.forEach(r => {
    const tr = el('tr');
    tr.setAttribute('data-testid', 'incomplete-row');
    tr.setAttribute('data-user', r.user);
    tr.setAttribute('data-progress', r.progress);
    [r.user, r.progress + '%', r.attempts, r.best_score].forEach(v => tr.appendChild(el('td', {}, String(v))));
    t.appendChild(tr);
  });
  view.appendChild(t);
}

async function renderTrainee(view) {
  const q = encodeURIComponent(current);
  const [lessons, p] = await Promise.all([
    api('GET', '/api/lessons'),
    api('GET', '/api/progress?user=' + q + '&viewer=' + q)
  ]);
  const state = {};
  p.lessons.forEach(l => state[l.lesson_id] = l.state);
  view.innerHTML = '';
  const pg = el('div', {}, '진도율 ' + p.progress + '%');
  pg.setAttribute('data-testid', 'progress');
  view.appendChild(pg);
  view.appendChild(el('div', {}, '응시 ' + p.attempts + '회 · 최고 점수 ' + p.best_score + '점'));
  lessons.forEach(l => {
    const row = el('div', {className: 'lesson'});
    row.setAttribute('data-testid', 'lesson');
    row.setAttribute('data-id', l.lesson_id);
    row.setAttribute('data-state', state[l.lesson_id]);
    const label = {done: '완료', open: '진행 가능', locked: '잠김'}[state[l.lesson_id]];
    row.appendChild(el('span', {}, l.seq + '. ' + l.title + ' (' + label + ')'));
    if (state[l.lesson_id] === 'open') {
      const b = el('button', {}, '다 봤어요');
      b.setAttribute('data-testid', 'complete-btn');
      b.onclick = () => act(() => api('POST', '/api/lessons/' + l.lesson_id + '/complete', {user: current}));
      row.appendChild(b);
    }
    view.appendChild(row);
  });
  if (p.certified) {
    const c = el('div', {}, '수료');
    c.setAttribute('data-testid', 'certified');
    view.appendChild(c);
  }
  if (p.lessons.every(l => l.state === 'done')) await renderQuiz(view, p);
}

async function renderQuiz(view, p) {
  if (!quizItems) quizItems = await api('GET', '/api/quiz');
  const box = el('div');
  box.setAttribute('data-testid', 'quiz');
  box.appendChild(el('h2', {}, '확인 퀴즈'));
  quizItems.forEach((it, i) => {
    const d = el('div', {className: 'q'});
    d.appendChild(el('div', {}, (i + 1) + '. ' + it.text));
    it.choices.forEach((c, j) => {
      const lab = el('label');
      lab.appendChild(el('input', {type: 'radio', name: 'q' + i, value: j}));
      lab.appendChild(document.createTextNode(' ' + c));
      d.appendChild(lab);
    });
    box.appendChild(d);
  });
  const sb = el('button', {}, '제출');
  sb.setAttribute('data-testid', 'submit-btn');
  sb.disabled = p.passed || p.attempts_left <= 0;
  sb.onclick = () => {
    const answers = quizItems.map((_, i) => {
      const c = box.querySelector('input[name="q' + i + '"]:checked');
      return c ? Number(c.value) : null;
    });
    if (answers.includes(null)) { say('모든 문항에 답해 주세요'); return; }
    act(async () => {
      lastResult = await api('POST', '/api/quiz/submit', {user: current, answers});
      return lastResult;
    });
  };
  box.appendChild(sb);
  if (lastResult) {
    const r = el('div', {}, '점수 ' + lastResult.score + '점 · ' + (lastResult.passed ? '합격' : '불합격') +
      ' · 남은 응시 ' + lastResult.attempts_left + '회');
    r.setAttribute('data-testid', 'result');
    box.appendChild(r);
  }
  view.appendChild(box);
}

async function act(fn) {
  say('');
  try { await fn(); await render(); } catch (e) { fail(e); }
}

$('user-select').onchange = (e) => { current = e.target.value; lastResult = null; say(''); load(); };
$('retry').onclick = () => { users = []; load(); };
load();
</script>
</body>
</html>
