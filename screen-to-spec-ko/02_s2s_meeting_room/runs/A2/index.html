<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온소프트 회의실 예약</title>
<style>
  :root { --brand:#2563eb; --line:#e2e8f0; --free:#f8fafc; --mine:#16a34a; --other:#94a3b8; --past:#f1f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; background:#f1f5f9; color:#0f172a; }
  header { background:var(--brand); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; flex:1; }
  header label { font-size:13px; display:flex; align-items:center; gap:6px; }
  select, input, button { font:inherit; }
  header select { padding:5px 8px; border-radius:6px; border:0; }
  main { max-width:1000px; margin:20px auto; padding:0 16px; }
  .bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar button { background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  .bar button:hover { background:#e0e7ff; }
  .bar input[type=date] { padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
  .legend { margin-left:auto; display:flex; gap:12px; font-size:12px; color:#475569; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:64px repeat(3, 1fr); background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .grid > div { border-bottom:1px solid var(--line); border-right:1px solid var(--line); min-height:34px; font-size:13px; }
  .grid > div:nth-child(4n) { border-right:0; }
  .head { background:#f8fafc; padding:10px 8px; text-align:center; font-weight:bold; }
  .head small { display:block; font-weight:normal; color:#64748b; font-size:11px; }
  .time { display:flex; align-items:center; justify-content:center; color:#64748b; font-size:12px; background:#f8fafc; }
  .slot { background:var(--free); cursor:pointer; }
  .slot:hover { background:#dbeafe; }
  .slot.past { background:var(--past); cursor:not-allowed; }
  .slot.past:hover { background:var(--past); }
  .busy { padding:5px 8px; color:#fff; background:var(--other); display:flex; flex-direction:column; justify-content:center; overflow:hidden; line-height:1.3; }
  .busy.mine { background:var(--mine); }
  .busy b { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .busy span { font-size:11px; opacity:.9; }
  .busy button { margin-top:4px; align-self:flex-start; background:rgba(255,255,255,.2); color:#fff; border:1px solid #fff; border-radius:4px; font-size:11px; padding:2px 8px; cursor:pointer; }
  .busy button:hover { background:#dc2626; border-color:#dc2626; }
  dialog { border:0; border-radius:12px; padding:22px; width:340px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(15,23,42,.4); }
  dialog h2 { margin:0 0 4px; font-size:17px; }
  dialog p { margin:0 0 14px; color:#64748b; font-size:13px; }
  dialog label { display:block; font-size:13px; margin-bottom:10px; }
  dialog input, dialog select { width:100%; padding:7px 9px; margin-top:4px; border:1px solid var(--line); border-radius:6px; }
  .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .actions button { padding:7px 16px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .actions .primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 18px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; } #toast.err { background:#dc2626; }
  h3 { margin:24px 0 8px; font-size:15px; }
  #mine-list { background:#fff; border:1px solid var(--line); border-radius:10px; }
  #mine-list div { padding:9px 14px; border-bottom:1px solid var(--line); font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  #mine-list div:last-child { border:0; }
  #mine-list .empty { color:#94a3b8; }
</style>
</head>
<body>
<header>
  <h1>🏢 다온소프트 회의실 예약</h1>
  <label>로그인 사용자
    <select id="user"></select>
  </label>
</header>
<main>
  <div class="bar">
    <button id="prev">◀ 이전날</button>
    <input type="date" id="day">
    <button id="next">다음날 ▶</button>
    <button id="today">오늘</button>
    <div class="legend">
      <span><i style="background:var(--free)"></i>예약 가능</span>
      <span><i style="background:var(--mine)"></i>내 예약</span>
      <span><i style="background:var(--other)"></i>다른 사람 예약</span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <h3>이 날짜의 내 예약</h3>
  <div id="mine-list"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlg-title">예약</h2>
    <p id="dlg-sub"></p>
    <label>제목 <input id="title" maxlength="50" placeholder="예: 주간 회의" required></label>
    <label>사용 시간 <select id="dur"></select></label>
    <div class="actions">
      <button type="button" id="cancel-dlg">닫기</button>
      <button type="submit" class="primary">예약하기</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const toMin = s => { const [h, m] = s.split(":"); return +h * 60 + +m; };
const toHM = n => String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0");
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let cfg, rooms = [], resv = [], pick = null;

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "요청 실패");
  return data;
}
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 2500);
}
const me = () => $("user").value;

function shiftDay(n) {
  const d = new Date($("day").value + "T00:00:00");
  d.setDate(d.getDate() + n);
  $("day").value = [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
  load();
}

async function load() {
  resv = await api("/api/reservations?day=" + $("day").value);
  render();
}

function isPast(startMin) {
  const now = new Date();
  const today = [now.getFullYear(), String(now.getMonth()+1).padStart(2,"0"), String(now.getDate()).padStart(2,"0")].join("-");
  const day = $("day").value;
  if (day < today) return true;
  return day === today && startMin < now.getHours() * 60 + now.getMinutes();
}

function render() {
  const s0 = toMin(cfg.day_start), e0 = toMin(cfg.day_end);
  let h = '<div class="head">시간</div>' + rooms.map(r =>
    `<div class="head">${esc(r.name)}<small>${esc(r.note)}</small></div>`).join("");
  for (let t = s0; t < e0; t += cfg.step) {
    h += `<div class="time">${toHM(t)}</div>`;
    for (const r of rooms) {
      const b = resv.find(x => x.room_id === r.id && toMin(x.start) <= t && t < toMin(x.end));
      if (!b) {
        const past = isPast(t);
        h += `<div class="slot${past ? " past" : ""}" data-room="${r.id}" data-t="${t}"></div>`;
      } else if (toMin(b.start) === t) {
        const mine = b.user === me();
        h += `<div class="busy${mine ? " mine" : ""}" style="grid-row:span ${(toMin(b.end) - t) / cfg.step}">
          <b>${esc(b.title)}</b><span>${esc(b.user)} · ${b.start}~${b.end}</span>
          ${mine ? `<button data-cancel="${b.id}">예약 취소</button>` : ""}</div>`;
      }
    }
  }
  $("grid").innerHTML = h;

  const mine = resv.filter(x => x.user === me());
  $("mine-list").innerHTML = mine.length
    ? mine.map(x => `<div><span>${x.start}~${x.end} · ${esc(rooms.find(r => r.id === x.room_id).name)} · ${esc(x.title)}</span>
        <a href="#" data-cancel="${x.id}">취소</a></div>`).join("")
    : '<div class="empty">이 날짜에 내 예약이 없습니다.</div>';
}

$("grid").addEventListener("click", async e => {
  const c = e.target.closest("[data-cancel]");
  if (c) return cancel(c.dataset.cancel);
  const s = e.target.closest(".slot");
  if (!s) return;
  if (s.classList.contains("past")) return toast("이미 지난 시간입니다.", true);
  openDialog(+s.dataset.room, +s.dataset.t);
});
$("mine-list").addEventListener("click", e => {
  const c = e.target.closest("[data-cancel]");
  if (c) { e.preventDefault(); cancel(c.dataset.cancel); }
});

async function cancel(id) {
  if (!confirm("이 예약을 취소할까요?")) return;
  try { await api(`/api/reservations/${id}?user=${encodeURIComponent(me())}`, { method: "DELETE" }); toast("예약이 취소되었습니다."); }
  catch (err) { toast(err.message, true); }
  load();
}

function openDialog(roomId, t) {
  const room = rooms.find(r => r.id === roomId);
  const limit = toMin(cfg.day_end);
  let max = t;  // 다음 예약 전까지 연장 가능한 끝 시각
  while (max < limit && !resv.some(x => x.room_id === roomId && toMin(x.start) <= max && max < toMin(x.end))) max += cfg.step;
  pick = { roomId, t };
  $("dlg-title").textContent = `${room.name} 예약`;
  $("dlg-sub").textContent = `${$("day").value} ${toHM(t)}부터 · 예약자: ${me()}`;
  $("dur").innerHTML = "";
  for (let e = t + cfg.step; e <= max; e += cfg.step) {
    const m = e - t, label = (m >= 60 ? Math.floor(m / 60) + "시간 " : "") + (m % 60 ? m % 60 + "분" : "");
    $("dur").add(new Option(`${label.trim()} (~${toHM(e)})`, e));
  }
  $("title").value = "";
  $("dlg").showModal();
  $("title").focus();
}

$("cancel-dlg").onclick = () => $("dlg").close();
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await api("/api/reservations", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room_id: pick.roomId, day: $("day").value, start: toHM(pick.t),
        end: toHM(+$("dur").value), user: me(), title: $("title").value.trim() }),
    });
    $("dlg").close(); toast("예약되었습니다.");
  } catch (err) { toast(err.message, true); $("dlg").close(); }
  load();
});

$("prev").onclick = () => shiftDay(-1);
$("next").onclick = () => shiftDay(1);
$("today").onclick = () => { $("day").value = cfg.today; load(); };
$("day").onchange = () => $("day").value && load();
$("user").onchange = () => { localStorage.setItem("user", me()); render(); };

(async () => {
  [cfg, rooms] = await Promise.all([api("/api/config"), api("/api/rooms")]);
  cfg.users.forEach(u => $("user").add(new Option(u, u)));
  const saved = localStorage.getItem("user");
  if (cfg.users.includes(saved)) $("user").value = saved;
  $("day").value = cfg.today;
  load();
  setInterval(load, 30000);  // 다른 사람의 예약 반영
})();
</script>
</body>
</html>
