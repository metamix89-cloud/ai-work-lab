<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온소프트 휴가 · 출장</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; max-width: 880px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; } h2 { font-size: 16px; margin-top: 28px; }
  .card { background: #f3f6fb; border-radius: 8px; padding: 14px 18px; font-size: 17px; }
  .card b { font-size: 22px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, button { font: inherit; padding: 5px 8px; }
  #message { color: #c0392b; min-height: 1.4em; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; font-size: 14px; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<h1>다온소프트 휴가 · 출장</h1>
<p>사용자: <select data-testid="user-select" id="user-select"></select></p>
<div id="error" class="error" hidden>불러오지 못했습니다 <button id="retry">다시 시도</button></div>

<h2>잔여 연차</h2>
<div class="card" id="balance">총 <span id="b-total">-</span> · 사용 <span id="b-used">-</span> · 대기 <span id="b-pending">-</span> · 잔여 <b data-testid="remaining" id="b-remaining">-</b></div>

<h2>신청</h2>
<form id="form">
  <select data-testid="type"><option>연차</option><option>출장</option></select>
  <input data-testid="start" type="date">
  <input data-testid="end" type="date">
  <input data-testid="reason" type="text" placeholder="사유">
  <button type="submit" data-testid="submit-btn">신청</button>
</form>
<div id="message" data-testid="message"></div>

<h2>내 신청</h2>
<table><thead><tr><th>종류</th><th>기간</th><th>일수</th><th>상태</th><th>결재자</th><th>반려 사유</th><th></th></tr></thead>
<tbody id="mine"></tbody></table>

<section id="pending-section" hidden>
  <h2>결재 대기</h2>
  <table><thead><tr><th>신청자</th><th>종류</th><th>기간</th><th>일수</th><th>사유</th><th></th></tr></thead>
  <tbody id="pending"></tbody></table>
</section>

<script>
const $ = (s) => document.querySelector(s);
const q = encodeURIComponent;
let users = [];

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function current() { return users.find((u) => u.user === $("#user-select").value); }

async function api(method, url, body) {
  const res = await fetch(url, {
    method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.detail) || "요청 실패");
    err.fromServer = true;
    throw err;
  }
  return data;
}

function setMessage(t) { $("#message").textContent = t || ""; }

async function refresh() {
  const u = current();
  if (!u) return;
  try {
    const [bal, mine, pending] = await Promise.all([
      api("GET", "/api/balance?user=" + q(u.user)),
      api("GET", "/api/requests?user=" + q(u.user)),
      u.role === "manager" ? api("GET", "/api/requests?approver=" + q(u.user)) : Promise.resolve([]),
    ]);
    $("#error").hidden = true;
    $("#b-total").textContent = bal.total;
    $("#b-used").textContent = bal.used;
    $("#b-pending").textContent = bal.pending;
    $("#b-remaining").textContent = bal.remaining;
    $("#mine").innerHTML = mine.map((r) => `<tr data-testid="my-request" data-id="${r.req_id}" data-status="${esc(r.status)}">
      <td>${esc(r.type)}</td><td>${esc(r.start)} ~ ${esc(r.end)}</td><td>${r.days}</td><td>${esc(r.status)}</td>
      <td>${esc(r.approver)}</td><td>${esc(r.reject_reason)}</td>
      <td>${r.status === "신청" ? `<button data-testid="cancel-btn" data-id="${r.req_id}">취소</button>` : ""}</td></tr>`).join("");
    $("#pending-section").hidden = u.role !== "manager";
    $("#pending").innerHTML = pending.map((r) => `<tr data-testid="pending-request" data-id="${r.req_id}">
      <td>${esc(r.user)}</td><td>${esc(r.type)}</td><td>${esc(r.start)} ~ ${esc(r.end)}</td><td>${r.days}</td><td>${esc(r.reason)}</td>
      <td><button data-testid="approve-btn" data-id="${r.req_id}">승인</button>
      <input data-testid="reject-reason" placeholder="반려 사유" hidden>
      <button data-testid="reject-btn" data-id="${r.req_id}">반려</button></td></tr>`).join("");
  } catch (e) {
    $("#error").hidden = false;
  }
}

async function load() {
  try {
    users = await api("GET", "/api/users");
    const sel = $("#user-select");
    const keep = sel.value;
    sel.innerHTML = users.map((u) => `<option>${esc(u.user)}</option>`).join("");
    if (keep) sel.value = keep;
    $("#error").hidden = true;
  } catch (e) {
    $("#error").hidden = false;
    return;
  }
  await refresh();
}

function fail(e) {
  if (e.fromServer) setMessage(e.message); else $("#error").hidden = false;
}

$("#user-select").addEventListener("change", () => { setMessage(""); refresh(); });
$("#retry").addEventListener("click", load);

$("#form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = (id) => $(`[data-testid="${id}"]`);
  try {
    await api("POST", "/api/requests", {
      user: current().user, type: f("type").value, start: f("start").value, end: f("end").value, reason: f("reason").value,
    });
    setMessage("");
    f("reason").value = "";
  } catch (e) { fail(e); }
  refresh();
});

document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id, tid = btn.dataset.testid, u = current();
  let call = null;
  if (tid === "cancel-btn") call = ["cancel", { user: u.user }];
  else if (tid === "approve-btn") call = ["approve", { approver: u.user }];
  else if (tid === "reject-btn") {
    const input = btn.parentElement.querySelector('[data-testid="reject-reason"]');
    if (input.hidden) { input.hidden = false; input.focus(); return; }
    call = ["reject", { approver: u.user, reason: input.value }];
  }
  if (!call) return;
  try {
    await api("POST", `/api/requests/${id}/${call[0]}`, call[1]);
    setMessage("");
  } catch (e) { fail(e); }
  refresh();
});

load();
</script>
</body>
</html>
