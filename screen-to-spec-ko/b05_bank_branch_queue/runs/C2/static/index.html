<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대기 관리 · 두둑은행 넉넉지점</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 24px; background: #f5f7fa; color: #222; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .box { background: #fff; border: 1px solid #d5dbe3; border-radius: 8px; padding: 16px; margin-top: 16px; max-width: 640px; }
  .ticket { padding: 6px 0; border-bottom: 1px solid #eef0f3; }
  .tag { display: inline-block; font-size: 12px; background: #1b5fd1; color: #fff; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
  #message { margin-top: 12px; min-height: 20px; color: #b00020; }
  button { padding: 6px 14px; margin-right: 8px; }
</style>
</head>
<body>
<h1>넉넉지점 대기 관리</h1>
<label>사용자 <select data-testid="user" id="user"></select></label>
<div id="error" hidden><span>불러오지 못했습니다</span> <button id="retry" type="button">다시 시도</button></div>
<div id="message" data-testid="message"></div>
<div id="view"></div>
<script>
const SERVICE = { deposit: "예금", loan: "대출", fx: "외환" };
let users = [];
let current = null;      // 선택한 사용자
let detail = null;       // 호출한 고객 상세 { ticket_id, ...}

const $ = function (id) { return document.getElementById(id); };
const msg = function (t) { $("message").textContent = t || ""; };

class ApiError extends Error {
  constructor(status, detail) { super(detail); this.status = status; this.detail = detail; }
}
async function api(method, url, body) {
  const opt = { method: method };
  if (body) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  let j = null;
  try { j = await r.json(); } catch (e) { /* 본문 없음 */ }
  if (!r.ok) throw new ApiError(r.status, (j && j.detail) || "요청에 실패했습니다");
  return j;
}
function el(tag, text, attrs) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  return e;
}
function showError(on) { $("error").hidden = !on; }

async function boot() {
  try {
    users = await api("GET", "/api/users");
    const sel = $("user");
    sel.textContent = "";
    users.forEach(function (u) {
      sel.appendChild(el("option", u.name + (u.role === "manager" ? " (지점장)" : " (" + u.counter_id + ")"), { value: u.user_id }));
    });
    showError(false);
    await choose();
  } catch (e) {
    showError(true);
  }
}

async function choose() {
  current = users.find(function (u) { return u.user_id === $("user").value; });
  detail = null;
  msg("");
  await refresh();
}

async function refresh() {
  if (!current) return;
  const view = $("view");
  try {
    if (current.role === "manager") {
      const s = await api("GET", "/api/manager/summary?viewer=" + encodeURIComponent(current.user_id));
      drawManager(view, s);
    } else {
      const qs = await api("GET", "/api/counters/" + current.counter_id + "/queue?viewer=" + encodeURIComponent(current.user_id));
      drawTeller(view, qs);
    }
    showError(false);
  } catch (e) {
    showError(true);
  }
}

function drawManager(view, s) {
  view.textContent = "";
  const box = el("div", null, { "data-testid": "summary", class: "box" });
  box.appendChild(el("h2", "대기 현황"));
  Object.keys(s.waiting).forEach(function (k) {
    box.appendChild(el("div", "대기 · " + SERVICE[k] + ": " + s.waiting[k] + "명"));
  });
  box.appendChild(el("div", "보류: " + s.held + "명"));
  box.appendChild(el("div", "완료: " + s.done + "명"));
  box.appendChild(el("h2", "창구별 호출 번호", { style: "margin-top:12px" }));
  s.counters.forEach(function (c) {
    box.appendChild(el("div", c.counter_id + " (" + SERVICE[c.service] + "): " + (c.number == null ? "-" : c.number + "번")));
  });
  view.appendChild(box);
}

function drawTeller(view, list) {
  view.textContent = "";
  const qbox = el("div", null, { class: "box" });
  qbox.appendChild(el("h2", "내 창구 대기 줄 (" + current.counter_id + ")"));
  if (!list.length) qbox.appendChild(el("div", "대기 중인 고객이 없습니다"));
  list.forEach(function (t) {
    const row = el("div", t.number + "번 " + t.masked_name + " · " + SERVICE[t.service], { "data-testid": "ticket", "data-id": t.ticket_id, class: "ticket" });
    if (t.priority) row.appendChild(el("span", "예약 우선", { class: "tag" }));
    qbox.appendChild(row);
  });
  const nextBtn = el("button", "다음 번호 호출", { "data-testid": "next", type: "button" });
  nextBtn.addEventListener("click", doNext);
  qbox.appendChild(el("div", null, { style: "margin-top:12px" })).appendChild(nextBtn);
  view.appendChild(qbox);

  if (detail) {
    const dbox = el("div", null, { class: "box" });
    dbox.appendChild(el("h2", "호출한 고객 (" + detail.number + "번)"));
    dbox.appendChild(el("div", detail.name, { "data-testid": "detail-name" }));
    dbox.appendChild(el("div", detail.phone, { "data-testid": "detail-phone" }));
    dbox.appendChild(el("div", "계좌 끝 4자리 " + detail.account_last4, { "data-testid": "detail-account" }));
    const done = el("button", "완료", { "data-testid": "complete", type: "button" });
    done.addEventListener("click", doComplete);
    dbox.appendChild(el("div", null, { style: "margin-top:12px" })).appendChild(done);
    view.appendChild(dbox);
  }
}

async function doNext() {
  msg("");
  try {
    const r = await api("POST", "/api/counters/" + current.counter_id + "/next", { user: current.user_id });
    if (r.called) {
      detail = await api("GET", "/api/tickets/" + r.called.ticket_id + "?viewer=" + encodeURIComponent(current.user_id));
    } else {
      detail = null;
      msg("대기 중인 고객이 없습니다");
    }
  } catch (e) {
    if (e instanceof ApiError) msg(e.detail); else { showError(true); return; }
  }
  await refresh();
}

async function doComplete() {
  msg("");
  try {
    await api("POST", "/api/tickets/" + detail.ticket_id + "/complete", { user: current.user_id });
    detail = null;
  } catch (e) {
    if (e instanceof ApiError) msg(e.detail); else { showError(true); return; }
  }
  await refresh();
}

$("user").addEventListener("change", choose);
$("retry").addEventListener("click", boot);
boot();
setInterval(refresh, 5000);
</script>
</body>
</html>
