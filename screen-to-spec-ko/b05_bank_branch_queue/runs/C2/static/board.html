<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대기 현황판 · 두둑은행 넉넉지점</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 24px; background: #f5f7fa; color: #222; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  .cols { display: flex; gap: 24px; flex-wrap: wrap; }
  .box { background: #fff; border: 1px solid #d5dbe3; border-radius: 8px; padding: 16px; min-width: 280px; flex: 1; }
  .row { padding: 8px 0; border-bottom: 1px solid #eef0f3; font-size: 20px; }
  .row:last-child { border-bottom: 0; }
  .empty { color: #888; }
  #error { color: #b00020; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>넉넉지점 대기 현황판</h1>
<div id="error" hidden><span>불러오지 못했습니다</span> <button id="retry" type="button">다시 시도</button></div>
<div class="cols">
  <div class="box">
    <h2>호출 중</h2>
    <div data-testid="serving"></div>
  </div>
  <div class="box">
    <h2>대기 중</h2>
    <div data-testid="waiting"></div>
  </div>
</div>
<script>
function fill(el, items, text) {
  el.textContent = "";
  if (!items.length) {
    const d = document.createElement("div");
    d.className = "row empty";
    d.textContent = "없음";
    el.appendChild(d);
    return;
  }
  items.forEach(function (it) {
    const d = document.createElement("div");
    d.className = "row";
    d.textContent = text(it);
    el.appendChild(d);
  });
}
async function load() {
  try {
    const r = await fetch("/api/board");
    if (!r.ok) throw new Error(r.status);
    const b = await r.json();
    fill(document.querySelector('[data-testid="serving"]'), b.serving,
      function (x) { return x.number + "번 " + x.masked_name + " → 창구 " + x.counter_id.replace(/^C/, ""); });
    fill(document.querySelector('[data-testid="waiting"]'), b.waiting,
      function (x) { return x.number + "번 " + x.masked_name; });
    document.getElementById("error").hidden = true;
  } catch (e) {
    document.getElementById("error").hidden = false;
  }
}
document.getElementById("retry").addEventListener("click", load);
load();
setInterval(load, 5000);
</script>
</body>
</html>
