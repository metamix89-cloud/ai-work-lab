<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>두둑은행 대기 현황</title><link rel="stylesheet" href="/static/style.css">
<style>
body{background:#0f1f19;color:#fff}
.wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;padding:24px}
.top2{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:var(--g)}
.top2 h1{margin:0;font-size:30px}.clock{font-size:28px;font-variant-numeric:tabular-nums}
h2{color:#9fd8bd;font-size:22px}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.c{background:#173026;border-radius:16px;padding:18px;text-align:center;border:2px solid transparent}
.c .n{color:#9fd8bd;font-size:22px}.c .t{font-size:64px;font-weight:800;min-height:80px;letter-spacing:2px}.c .s{color:#8aa89a;font-size:15px}
.c.fresh{border-color:#ffd43b;animation:b 1s infinite alternate}.c.idle .t{color:#4d6a5d;font-size:34px;line-height:80px}
@keyframes b{to{background:#3d5a10}}
.q{background:#173026;border-radius:16px;padding:18px}
.q .it{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #264a3a;font-size:26px}
.q .o{width:36px;color:#8aa89a;font-size:20px}.q .no{font-weight:700;width:110px}.q .sv{flex:1;color:#cfe6da;font-size:20px}
.q .p{font-size:14px;background:#1c6dd0;border-radius:99px;padding:2px 10px}
.sum{display:flex;gap:10px;margin-bottom:12px}.sum div{flex:1;background:#0f1f19;border-radius:10px;padding:8px;text-align:center;font-size:15px;color:#9fd8bd}.sum b{display:block;font-size:28px;color:#fff}
.foot{text-align:center;color:#6f8a7d;font-size:14px;padding-bottom:12px}
</style></head><body>
<div class="top2"><h1>🏦 두둑은행 · 대기 현황</h1><div class="clock" id="clock"></div></div>
<div class="wrap">
 <section><h2>호출 창구</h2><div class="cs" id="cs"></div></section>
 <section class="q"><h2 style="margin-top:0">대기 순서 <span id="tot" style="font-size:16px"></span></h2><div class="sum" id="sum"></div><div id="ql"></div></section>
</div>
<div class="foot">예약 고객은 우선 호출됩니다 · 번호가 호출되면 해당 창구로 와 주세요</div>
<script src="/static/common.js"></script>
<script>
let last={};
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
async function tick(){
  try{
    const j=await api("/api/board");
    $("#clock").textContent=j.now.slice(11,16);
    $("#cs").innerHTML=j.counters.map(c=>`<div class="c ${c.ticket_no?'':'idle'} ${c.fresh?'fresh':''}"><div class="n">${c.counter}번 창구</div><div class="t">${c.ticket_no?esc(c.ticket_no):'대기'}</div><div class="s">${esc(c.services.join(' · '))}</div></div>`).join("");
    const first=!Object.keys(last).length;
    j.counters.forEach(c=>{if(c.fresh&&!first&&last[c.counter]!==c.called_at)beep();last[c.counter]=c.called_at});
    $("#tot").textContent=`(총 ${j.waiting_total}명)`;
    $("#sum").innerHTML=Object.entries(j.by_service).map(([k,v])=>`<div>${esc(k)}<b>${v}</b></div>`).join("");
    $("#ql").innerHTML=j.waiting.length?j.waiting.map(w=>`<div class="it"><span class="o">${w.order}</span><span class="no">${esc(w.ticket_no)}</span><span class="sv">${esc(w.service)}</span>${w.priority?'<span class="p">예약</span>':''}</div>`).join(""):'<div class="it muted">대기 고객이 없습니다</div>';
  }catch(e){}
}
tick();setInterval(tick,3000);
</script></body></html>
