<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대기 현황판 · 두둑은행 넉넉지점</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 24px; background: #f4f6f8; color: #1d2733; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  .cols { display: flex; gap: 24px; flex-wrap: wrap; }
  section { flex: 1; min-width: 280px; background: #fff; border-radius: 8px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .row { display: flex; gap: 16px; padding: 8px 0; border-bottom: 1px solid #e3e8ee; font-size: 20px; }
  .row .no { font-weight: bold; min-width: 56px; }
  .empty { color: #7a8794; }
  #error { display: none; background: #fdecea; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
</style>
</head>
<body>
<h1>대기 현황판</h1>
<div id="error">불러오지 못했습니다 <button id="retry" type="button">다시 시도</button></div>
<div class="cols">
  <section><h2>호출 중</h2><div data-testid="serving"></div></section>
  <section><h2>대기 중</h2><div data-testid="waiting"></div></section>
</div>
<script>
function fill(box, rows, build) {
  box.textContent = "";
  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "없음";
    box.appendChild(e);
    return;
  }
  rows.forEach(function (r) {
    const d = document.createElement("div");
    d.className = "row";
    build(d, r).forEach(function (t, i) {
      const s = document.createElement("span");
      if (i === 0) s.className = "no";
      s.textContent = t;
      d.appendChild(s);
    });
    box.appendChild(d);
  });
}
async function load() {
  try {
    const r = await fetch("/api/board");
    if (!r.ok) throw new Error(r.status);
    const b = await r.json();
    document.getElementById("error").style.display = "none";
    fill(document.querySelector('[data-testid="serving"]'), b.serving,
      function (d, x) { return [x.number, x.masked_name, "창구 " + x.counter_id.replace(/^\D+/, "")]; });
    fill(document.querySelector('[data-testid="waiting"]'), b.waiting,
      function (d, x) { return [x.number, x.masked_name]; });
  } catch (e) {
    document.getElementById("error").style.display = "block";
  }
}
document.getElementById("retry").addEventListener("click", load);
load();
setInterval(load, 5000);
</script>
</body>
</html>
