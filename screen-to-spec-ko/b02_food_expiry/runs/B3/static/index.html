<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬르륵식품 유통기한 임박 재고 알림판</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 24px; background: #f6f6f4; color: #222; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .bar label { display: flex; gap: 6px; align-items: center; }
  input, select, button { font: inherit; padding: 6px 8px; }
  .summary { display: flex; gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px 20px; min-width: 140px; }
  .card b { display: block; font-size: 24px; margin-top: 4px; }
  #message { min-height: 22px; margin-bottom: 12px; font-weight: bold; }
  #message.error { color: #c0392b; }
  #message.ok { color: #1e7e34; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background: #eee; }
  tr[data-state="near"] { background: #fff4d6; }
  tr[data-state="expired"] { background: #fbdcdc; }
  #fail { display: none; background: #fff; border: 1px solid #c0392b; padding: 16px; }
</style>
</head>
<body>
<h1>꼬르륵식품 유통기한 임박 재고 알림판</h1>

<div class="bar">
  <label>사용자 <select data-testid="user" id="user"></select></label>
  <label>품목 <select data-testid="item" id="item"></select></label>
  <label>수량 <input data-testid="qty" id="qty" type="number" min="1" step="1" value="1" style="width:80px"></label>
  <button data-testid="ship" id="ship">출고</button>
</div>

<div id="message-wrap"><div data-testid="message" id="message"></div></div>

<div id="fail">
  <span>불러오지 못했습니다</span>
  <button id="retry">다시 시도</button>
</div>

<div id="main">
  <div class="summary">
    <div class="card">임박 로트 수<b data-testid="sum-near" id="sum-near">0</b></div>
    <div class="card">만료 로트 수<b data-testid="sum-expired" id="sum-expired">0</b></div>
    <div class="card">임박 재고 금액(원)<b data-testid="sum-near-value" id="sum-near-value">0</b></div>
  </div>
  <table>
    <thead><tr><th>품목</th><th>로트</th><th>유통기한</th><th>남은 일수</th><th>수량</th><th>상태</th><th>폐기</th></tr></thead>
    <tbody id="lots"></tbody>
  </table>
</div>

<script>
const LABEL = { ok: "정상", near: "임박", expired: "만료" };
let users = [], lots = [];
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setMessage(text, kind) {
  const m = $("message");
  m.textContent = text;
  m.className = kind || "";
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const e = new Error((data && data.detail) || "요청에 실패했습니다");
    e.server = true;
    throw e;
  }
  return data;
}

const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
});

function renderSummary(s) {
  $("sum-near").textContent = s.near;
  $("sum-expired").textContent = s.expired;
  $("sum-near-value").textContent = Number(s.near_value).toLocaleString("ko-KR");
}

function currentUser() { return users.find(u => u.user_id === $("user").value); }

function renderLots() {
  const manager = (currentUser() || {}).role === "manager";
  $("lots").innerHTML = lots.filter(l => l.qty > 0).map(l => {
    const btn = manager && l.state === "expired"
      ? `<input data-testid="reason" placeholder="폐기 사유" maxlength="200">
         <button data-testid="dispose" data-lot="${esc(l.lot_id)}">폐기</button>`
      : "";
    return `<tr data-testid="lot" data-id="${esc(l.lot_id)}" data-state="${l.state}">
      <td>${esc(l.item_name)}</td><td>${esc(l.lot_id)}</td><td>${esc(l.expires_on)}</td>
      <td>${l.days_left}일</td><td>${l.qty}</td><td>${LABEL[l.state]}</td><td>${btn}</td></tr>`;
  }).join("");
}

function applyLots(data) {
  lots = data.lots;
  renderSummary(data.summary);
  renderLots();
}

function showFail(on) {
  $("fail").style.display = on ? "block" : "none";
  $("main").style.display = on ? "none" : "block";
}

async function load() {
  try {
    const [u, it, l] = await Promise.all([api("/api/users"), api("/api/items"), api("/api/lots")]);
    const keepUser = $("user").value, keepItem = $("item").value;
    users = u;
    $("user").innerHTML = u.map(x => `<option value="${esc(x.user_id)}">${esc(x.name)} (${x.role === "manager" ? "관리자" : "창고 담당"})</option>`).join("");
    $("item").innerHTML = it.map(x => `<option value="${esc(x.item_id)}">${esc(x.name)}</option>`).join("");
    if (keepUser) $("user").value = keepUser;
    if (keepItem) $("item").value = keepItem;
    showFail(false);
    applyLots(l);
  } catch (e) {
    showFail(true);
  }
}

$("retry").addEventListener("click", load);
$("user").addEventListener("change", renderLots);

$("ship").addEventListener("click", async () => {
  const raw = $("qty").value.trim();
  const qty = /^-?\d+$/.test(raw) ? parseInt(raw, 10) : raw;
  try {
    const r = await post("/api/ship", { user: $("user").value, item_id: $("item").value, qty });
    applyLots(r);
    setMessage("배분: " + r.allocations.map(a => `${a.lot_id} ${a.qty}개`).join(", "), "ok");
  } catch (e) {
    setMessage(e.server ? e.message : "불러오지 못했습니다", "error");
  }
});

$("lots").addEventListener("click", async ev => {
  const b = ev.target.closest('[data-testid="dispose"]');
  if (!b) return;
  const reason = b.parentElement.querySelector('[data-testid="reason"]').value;
  try {
    const r = await post(`/api/lots/${encodeURIComponent(b.dataset.lot)}/dispose`, { user: $("user").value, reason });
    renderSummary(r.summary);
    const fresh = await api("/api/lots");
    applyLots(fresh);
    setMessage(`폐기: ${r.lot.lot_id}`, "ok");
  } catch (e) {
    setMessage(e.server ? e.message : "불러오지 못했습니다", "error");
  }
});

load();
</script>
</body>
</html>
