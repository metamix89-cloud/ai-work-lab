<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬르륵식품 유통기한 임박 재고 알림판</title>
<style>
body{font-family:'Malgun Gothic',sans-serif;margin:0;padding:20px;background:#f6f6f4;color:#222}
h1{font-size:20px;margin:0 0 14px}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;padding:12px;border-radius:8px;margin-bottom:14px}
.bar label{display:flex;gap:6px;align-items:center}
input,select,button{font-size:14px;padding:6px 8px}
.sum{display:flex;gap:12px;margin-bottom:14px}
.sum div{flex:1;background:#fff;border-radius:8px;padding:12px;text-align:center}
.sum b{display:block;font-size:24px;margin-top:4px}
#message{min-height:22px;margin-bottom:10px;font-weight:bold}
#message.err{color:#c0392b}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left}
th{background:#eee}
tr[data-state=near]{background:#fff4d6}
tr[data-state=expired]{background:#fde0dd}
#error{background:#fff;padding:20px;border-radius:8px;text-align:center}
[hidden]{display:none !important}
</style>
</head>
<body>
<h1>꼬르륵식품 · 유통기한 임박 재고 알림판</h1>
<div class="bar">
  <label>사용자 <select data-testid="user" id="user"></select></label>
  <label>품목 <select data-testid="item" id="item"></select></label>
  <label>수량 <input data-testid="qty" id="qty" type="number" min="1" value="1" style="width:80px"></label>
  <button data-testid="ship" id="ship">출고</button>
</div>
<div class="sum">
  <div>임박 로트 수<b data-testid="sum-near" id="sum-near">0</b></div>
  <div>만료 로트 수<b data-testid="sum-expired" id="sum-expired">0</b></div>
  <div>임박 재고 금액(원)<b data-testid="sum-near-value" id="sum-near-value">0</b></div>
</div>
<div id="message" data-testid="message"></div>
<div id="error" hidden><p>불러오지 못했습니다</p><button id="retry">다시 시도</button></div>
<table id="board">
  <thead><tr><th>품목</th><th>로트</th><th>유통기한</th><th>남은 일수</th><th>수량</th><th>상태</th><th>폐기</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const STATE = {ok: '정상', near: '임박', expired: '만료'};
let users = [], lots = [], summ = {near: 0, expired: 0, near_value: 0};
const $ = id => document.getElementById(id);
const won = n => Number(n).toLocaleString('ko-KR');

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.detail) || '요청 실패'); err.server = true; throw err; }
  return data;
}
function msg(text, isErr) { const m = $('message'); m.textContent = text; m.className = isErr ? 'err' : ''; }
function curUser() { return users.find(u => u.user_id === $('user').value); }

function render(list, sum) {
  lots = list; summ = sum;
  $('sum-near').textContent = sum.near;
  $('sum-expired').textContent = sum.expired;
  $('sum-near-value').textContent = won(sum.near_value);
  const isMgr = curUser() && curUser().role === 'manager';
  const body = $('rows');
  body.innerHTML = '';
  for (const l of list) {
    if (l.qty <= 0) continue;
    const tr = document.createElement('tr');
    tr.setAttribute('data-testid', 'lot');
    tr.dataset.id = l.lot_id;
    tr.dataset.state = l.state;
    const cells = [l.item_name, l.lot_id, l.expires_on, l.days_left + '일', l.qty, STATE[l.state]];
    for (const c of cells) { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }
    const td = document.createElement('td');
    if (isMgr && l.state === 'expired') {
      const inp = document.createElement('input');
      inp.setAttribute('data-testid', 'reason'); inp.placeholder = '폐기 사유';
      const btn = document.createElement('button');
      btn.setAttribute('data-testid', 'dispose'); btn.textContent = '폐기';
      btn.onclick = () => dispose(l.lot_id, inp.value);
      td.append(inp, btn);
    }
    tr.appendChild(td);
    body.appendChild(tr);
  }
}

async function load() {
  try {
    const [u, it, l] = await Promise.all([api('/api/users'), api('/api/items'), api('/api/lots')]);
    const prev = $('user').value, prevItem = $('item').value;
    users = u;
    $('user').innerHTML = u.map(x => `<option value="${x.user_id}">${x.name} (${x.role === 'manager' ? '관리자' : '창고 담당'})</option>`).join('');
    if (prev && u.some(x => x.user_id === prev)) $('user').value = prev;
    $('item').innerHTML = it.map(x => `<option value="${x.item_id}">${x.name}</option>`).join('');
    if (prevItem && it.some(x => x.item_id === prevItem)) $('item').value = prevItem;
    $('error').hidden = true; $('board').hidden = false;
    render(l.lots, l.summary);
  } catch (e) {
    $('error').hidden = false; $('board').hidden = true;
  }
}

function post(path, body) {
  return api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
}

$('ship').onclick = async () => {
  try {
    const d = await post('/api/ship', {user: $('user').value, item_id: $('item').value, qty: Number($('qty').value)});
    render(d.lots, d.summary);
    msg('배분: ' + d.allocations.map(a => `${a.lot_id} ${a.qty}개`).join(', '), false);
  } catch (e) { msg(e.server ? e.message : '불러오지 못했습니다', true); }
};

async function dispose(id, reason) {
  try {
    await post('/api/lots/' + encodeURIComponent(id) + '/dispose', {user: $('user').value, reason});
    const l = await api('/api/lots');
    render(l.lots, l.summary);
    msg('폐기 완료: ' + id, false);
  } catch (e) { msg(e.server ? e.message : '불러오지 못했습니다', true); }
}

$('user').onchange = () => render(lots, summ);
$('retry').onclick = load;
load();
</script>
</body>
</html>
