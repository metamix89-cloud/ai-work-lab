<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 소호 쇼핑몰</title>
<style>
  :root { --green:#2f7d4f; --green-d:#225c3a; --red:#d6393a; --bg:#faf8f3; --line:#e5e0d4; --muted:#777; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; background:var(--bg); color:#222; }
  header { background:var(--green); color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:20px; }
  .cart-btn { background:#fff; color:var(--green-d); border:0; border-radius:20px; padding:8px 16px; font-weight:700; cursor:pointer; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px; display:grid; grid-template-columns:1fr 340px; gap:24px; align-items:start; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tab { border:1px solid var(--line); background:#fff; border-radius:16px; padding:6px 14px; cursor:pointer; }
  .tab.on { background:var(--green); color:#fff; border-color:var(--green); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; position:relative; }
  .card.soldout { opacity:.65; }
  .emoji { font-size:52px; text-align:center; background:#f3efe4; border-radius:8px; padding:10px 0; }
  .name { font-weight:700; }
  .desc { font-size:12.5px; color:var(--muted); min-height:34px; }
  .badge { position:absolute; top:10px; left:10px; background:var(--red); color:#fff; font-size:12px; font-weight:700; padding:2px 8px; border-radius:10px; }
  .badge.so { background:#555; }
  .price { font-size:17px; font-weight:700; }
  .price .orig { color:#aaa; text-decoration:line-through; font-size:13px; font-weight:400; margin-right:4px; }
  .price .pct { color:var(--red); margin-right:4px; }
  select, input[type=number] { padding:6px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .row { display:flex; gap:6px; }
  .row select { flex:1; min-width:0; }
  .row input { width:62px; }
  button.add { background:var(--green); color:#fff; border:0; border-radius:6px; padding:9px; font-weight:700; cursor:pointer; }
  button.add:disabled { background:#bbb; cursor:not-allowed; }
  aside { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; position:sticky; top:72px; }
  aside h2 { margin:0 0 10px; font-size:17px; }
  .item { border-bottom:1px solid var(--line); padding:10px 0; font-size:14px; }
  .item .t { display:flex; justify-content:space-between; gap:8px; }
  .item .opt { color:var(--muted); font-size:12.5px; }
  .item .ctl { display:flex; align-items:center; gap:6px; margin-top:6px; justify-content:space-between; }
  .qty button { width:26px; height:26px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
  .qty span { display:inline-block; min-width:26px; text-align:center; }
  .del { background:none; border:0; color:var(--muted); cursor:pointer; text-decoration:underline; font-size:12px; }
  .warn { color:var(--red); font-size:12px; margin-top:4px; }
  .item.na { background:#fdf0f0; }
  .sum div { display:flex; justify-content:space-between; padding:4px 0; }
  .sum .total { font-size:18px; font-weight:800; border-top:2px solid #222; margin-top:6px; padding-top:10px; }
  .sum .disc { color:var(--red); }
  .free { font-size:12.5px; background:#eef6f0; color:var(--green-d); padding:8px; border-radius:6px; margin-top:8px; }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
  .note { font-size:11.5px; color:var(--muted); margin-top:10px; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:20px; opacity:0; transition:.25s; pointer-events:none; z-index:9; }
  #toast.show { opacity:1; }
  @media (max-width:820px) { .wrap { grid-template-columns:1fr; } aside { position:static; } }
</style>
</head>
<body>
<header>
  <h1>🌾 가나다식품 소호 쇼핑몰</h1>
  <button class="cart-btn" onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">장바구니 <span id="cnt">0</span></button>
</header>
<div class="wrap">
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside id="cart"></aside>
</div>
<div id="toast"></div>

<script>
const won = n => n.toLocaleString("ko-KR") + "원";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cartId = localStorage.getItem("cartId");
if (!cartId) { cartId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)); localStorage.setItem("cartId", cartId); }
let products = [], category = "전체";

async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "요청을 처리할 수 없습니다.");
  return data;
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

function priceHtml(o, pct) {
  return (pct ? `<span class="orig">${won(o.original_price)}</span><span class="pct">${pct}%</span>` : "") + won(o.price);
}
function renderTabs() {
  const cats = ["전체", ...new Set(products.map(p => p.category))];
  document.getElementById("tabs").innerHTML = cats.map(c => `<button class="tab ${c === category ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { category = b.dataset.c; renderTabs(); renderProducts(); });
}
function renderProducts() {
  const list = products.filter(p => category === "전체" || p.category === category);
  document.getElementById("grid").innerHTML = list.map(p => {
    const first = p.options.find(o => !o.sold_out) || p.options[0];
    const badge = p.sold_out ? `<span class="badge so">품절</span>` : p.discount_percent ? `<span class="badge">${p.discount_percent}% 할인</span>` : "";
    return `<div class="card ${p.sold_out ? "soldout" : ""}" data-p="${p.id}">
      ${badge}<div class="emoji">${p.emoji}</div>
      <div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description)}</div>
      <div class="price" id="pr${p.id}">${priceHtml(first, p.discount_percent)}</div>
      <div class="row">
        <select id="op${p.id}" ${p.sold_out ? "disabled" : ""}>
          ${p.options.map(o => `<option value="${o.id}" ${o.sold_out ? "disabled" : ""} ${o.id === first.id ? "selected" : ""}>${esc(o.label)}${o.sold_out ? " (품절)" : ""}</option>`).join("")}
        </select>
        <input type="number" id="q${p.id}" value="1" min="1" max="20" ${p.sold_out ? "disabled" : ""}>
      </div>
      <button class="add" id="b${p.id}" ${p.sold_out ? "disabled" : ""}>${p.sold_out ? "품절" : "장바구니 담기"}</button>
    </div>`;
  }).join("");
  list.forEach(p => {
    const sel = document.getElementById("op" + p.id);
    sel.onchange = () => { const o = p.options.find(o => o.id == sel.value); document.getElementById("pr" + p.id).innerHTML = priceHtml(o, p.discount_percent); };
    document.getElementById("b" + p.id).onclick = async () => {
      const qty = parseInt(document.getElementById("q" + p.id).value, 10);
      if (!(qty >= 1 && qty <= 20)) return toast("수량은 1~20개로 입력해 주세요.");
      try { renderCart(await api(`/api/cart/${cartId}/items`, "POST", { option_id: +sel.value, qty })); toast("장바구니에 담았습니다."); }
      catch (e) { toast(e.message); }
    };
  });
}
function renderCart(c) {
  document.getElementById("cnt").textContent = c.items.filter(i => !i.unavailable).reduce((s, i) => s + i.qty, 0);
  const el = document.getElementById("cart");
  let h = `<h2>🛒 장바구니</h2>`;
  if (!c.items.length) h += `<div class="empty">장바구니가 비어 있습니다.</div>`;
  c.items.forEach(i => {
    h += `<div class="item ${i.unavailable ? "na" : ""}">
      <div class="t"><b>${i.emoji} ${esc(i.name)}</b><span>${i.unavailable ? "—" : won(i.line_total)}</span></div>
      <div class="opt">${esc(i.option)} · ${won(i.unit_price)}${i.unit_price < i.original_price ? ` <s>${won(i.original_price)}</s>` : ""}</div>
      ${i.unavailable ? `<div class="warn">품절되어 주문 합계에서 제외됩니다.</div>` : ""}
      ${i.over_stock ? `<div class="warn">재고가 부족합니다 (남은 수량 ${i.stock}개). 수량을 줄여 주세요.</div>` : ""}
      <div class="ctl">
        <div class="qty"><button data-a="dec" data-id="${i.id}" data-q="${i.qty}" ${i.unavailable ? "disabled" : ""}>−</button><span>${i.qty}</span><button data-a="inc" data-id="${i.id}" data-q="${i.qty}" ${i.unavailable ? "disabled" : ""}>+</button></div>
        <button class="del" data-a="del" data-id="${i.id}">삭제</button>
      </div></div>`;
  });
  if (c.items.length) {
    h += `<div class="sum">
      <div><span>상품 금액</span><span>${won(c.subtotal + c.discount_total)}</span></div>
      ${c.discount_total ? `<div class="disc"><span>할인</span><span>−${won(c.discount_total)}</span></div>` : ""}
      <div><span>배송비</span><span>${c.shipping ? won(c.shipping) : "무료"}</span></div>
      <div class="total"><span>합계</span><span>${won(c.total)}</span></div></div>
      <div class="free">${c.subtotal === 0 ? "" : c.remaining_for_free > 0 ? `${won(c.remaining_for_free)} 더 담으면 배송비 무료!` : "🎉 무료배송 적용"}
        (${won(c.free_shipping_threshold)} 이상 무료, 미만 ${won(3000)})</div>
      <div class="note">※ 데모용 쇼핑몰이며 결제 기능은 없습니다.</div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.a, q = +b.dataset.q;
    try {
      if (a === "del") renderCart(await api(`/api/cart/${cartId}/items/${id}`, "DELETE"));
      else if (a === "inc") renderCart(await api(`/api/cart/${cartId}/items/${id}`, "PATCH", { qty: q + 1 }));
      else if (q > 1) renderCart(await api(`/api/cart/${cartId}/items/${id}`, "PATCH", { qty: q - 1 }));
    } catch (e) { toast(e.message); }
  });
}
(async () => {
  products = await api("/api/products");
  renderTabs(); renderProducts();
  renderCart(await api(`/api/cart/${cartId}`));
})();
</script>
</body>
</html>
