<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가나다식품 주문·재고 백오피스</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic",system-ui,sans-serif;background:#f4f5f7;color:#222;font-size:14px}
header{background:#1f3a5f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px}
header h1{font-size:17px;margin:0;flex:1}
nav{display:flex;gap:4px;background:#fff;padding:0 20px;border-bottom:1px solid #ddd}
nav button{border:0;background:none;padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent}
nav button.on{border-color:#1f3a5f;font-weight:700}
main{padding:20px;max-width:1200px;margin:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden}
th,td{padding:9px 12px;border-bottom:1px solid #eee;text-align:left}
th{background:#eef1f5;font-size:13px}
td.r,th.r{text-align:right}
tr.click:hover{background:#f0f6ff;cursor:pointer}
button.b{background:#1f3a5f;color:#fff;border:0;padding:7px 14px;border-radius:4px;cursor:pointer}
button.b.red{background:#c0392b}button.b.gray{background:#7b8794}button.b.green{background:#2e8b57}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{padding:7px;border:1px solid #ccc;border-radius:4px;font:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:#fff;padding:14px;border-radius:6px}
.card b{display:block;font-size:24px;margin-top:4px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.PENDING{background:#e0a100}.CONFIRMED{background:#2d7dd2}.SHIPPED{background:#2e8b57}.CANCELLED{background:#8a8a8a}.REFUNDED{background:#c0392b}
.bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:5}
.modal>div{background:#fff;padding:22px;border-radius:8px;width:680px;max-width:95vw;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:6px;color:#fff;z-index:9}
.low{color:#c0392b;font-weight:700}
.login{max-width:320px;margin:15vh auto;background:#fff;padding:28px;border-radius:8px;display:grid;gap:10px}
.hint{color:#777;font-size:12px}
h3{margin:18px 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $app = document.getElementById('app');
let S = {token: localStorage.getItem('tk'), user: null, tab: 'dash', products: [], filter: '', q: ''};
const ST = {PENDING:'접수(대기)',CONFIRMED:'확정',SHIPPED:'출고완료',CANCELLED:'취소',REFUNDED:'환불'};
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method='GET', body) {
  const r = await fetch('/api' + path, {method, headers: {'Content-Type':'application/json', Authorization:'Bearer ' + S.token}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && S.user) { logout(); }
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '입력값을 확인하세요.');
  return d;
}
function toast(msg, ok=true) {
  const t = document.createElement('div'); t.className = 'toast'; t.style.background = ok ? '#2e8b57' : '#c0392b'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 3500);
}
async function run(fn) { try { await fn(); } catch (e) { toast(e.message, false); } }
function logout() { localStorage.removeItem('tk'); S.token = null; S.user = null; render(); }

async function boot() {
  if (S.token) { try { S.user = await api('/me'); } catch { S.token = null; } }
  render();
}
function render() { S.user ? renderMain() : renderLogin(); }

function renderLogin() {
  $app.innerHTML = `<form class="login" id="lf"><h2 style="margin:0">가나다식품 백오피스</h2>
    <input name="u" placeholder="아이디" autofocus><input name="p" type="password" placeholder="비밀번호">
    <button class="b">로그인</button>
    <div class="hint">직원: staff / staff123<br>관리자: admin / admin123</div></form>`;
  document.getElementById('lf').onsubmit = e => { e.preventDefault(); run(async () => {
    const f = e.target, d = await api('/login', 'POST', {username: f.u.value, password: f.p.value});
    S.token = d.token; localStorage.setItem('tk', d.token); S.user = d.user; render();
  }); };
}

function renderMain() {
  const tabs = [['dash','대시보드'],['orders','주문 관리'],['stock','재고 관리']];
  $app.innerHTML = `<header><h1>🍚 가나다식품 주문·재고 백오피스</h1><span>${esc(S.user.name)} (${S.user.role==='admin'?'관리자':'직원'})</span><button class="b gray" id="lo">로그아웃</button></header>
  <nav>${tabs.map(([k,v]) => `<button data-t="${k}" class="${S.tab===k?'on':''}">${v}</button>`).join('')}</nav><main id="mn"></main>`;
  document.getElementById('lo').onclick = logout;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderMain(); });
  run(() => ({dash: viewDash, orders: viewOrders, stock: viewStock})[S.tab]());
}

async function viewDash() {
  const d = await api('/dashboard'), c = d.counts;
  document.getElementById('mn').innerHTML = `<div class="cards">
    ${Object.keys(ST).map(k => `<div class="card"><span class="tag ${k}">${ST[k]}</span><b>${c[k]||0}건</b></div>`).join('')}
    <div class="card">확정·출고 매출<b>${won(d.sales)}</b></div></div>
    <h3>⚠ 안전재고 이하 상품</h3>
    <table><tr><th>SKU</th><th>상품</th><th class="r">재고</th><th class="r">안전재고</th></tr>
    ${d.low_stock.map(p => `<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td class="r low">${p.stock}</td><td class="r">${p.safety_stock}</td></tr>`).join('') || '<tr><td colspan=4>없음</td></tr>'}</table>`;
}

async function viewOrders() {
  const qs = new URLSearchParams(); if (S.filter) qs.set('status', S.filter); if (S.q) qs.set('q', S.q);
  const list = await api('/orders?' + qs);
  document.getElementById('mn').innerHTML = `<div class="bar">
    <select id="fs"><option value="">전체 상태</option>${Object.entries(ST).map(([k,v]) => `<option value="${k}" ${S.filter===k?'selected':''}>${v}</option>`).join('')}</select>
    <input id="qs" placeholder="고객명 / 주문번호" value="${esc(S.q)}"><button class="b" id="sb">검색</button>
    <span style="flex:1"></span><button class="b green" id="nw">+ 주문 접수</button></div>
    <table><tr><th>번호</th><th>일시</th><th>고객</th><th>상품</th><th class="r">금액</th><th>상태</th></tr>
    ${list.map(o => `<tr class="click" data-id="${o.id}"><td>#${o.id}</td><td>${esc(o.created_at)}</td><td>${esc(o.customer)}</td><td>${esc(o.summary)}</td><td class="r">${won(o.total)}</td><td><span class="tag ${o.status}">${ST[o.status]}</span></td></tr>`).join('') || '<tr><td colspan=6>주문이 없습니다.</td></tr>'}</table>`;
  document.getElementById('fs').onchange = e => { S.filter = e.target.value; viewOrders(); };
  document.getElementById('sb').onclick = () => { S.q = document.getElementById('qs').value; run(viewOrders); };
  document.getElementById('qs').onkeydown = e => { if (e.key === 'Enter') document.getElementById('sb').click(); };
  document.getElementById('nw').onclick = () => run(newOrder);
  document.querySelectorAll('tr.click').forEach(r => r.onclick = () => run(() => openOrder(r.dataset.id)));
}

function modal(html) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div>${html}</div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.append(m); return m;
}

async function openOrder(id) {
  document.querySelectorAll('.modal').forEach(m => m.remove());
  const o = await api('/orders/' + id), s = o.status, admin = S.user.role === 'admin';
  const m = modal(`<h2 style="margin-top:0">주문 #${o.id} <span class="tag ${s}">${ST[s]}</span></h2>
    <p>${esc(o.customer)} · ${esc(o.phone)}<br>${esc(o.address)}${o.note ? '<br>메모: ' + esc(o.note) : ''}</p>
    <table><tr><th>상품</th><th class="r">단가</th><th class="r">수량</th><th class="r">현재고</th></tr>
    ${o.items.map(i => `<tr><td>${esc(i.name)}</td><td class="r">${won(i.unit_price)}</td><td class="r">${i.qty}</td><td class="r ${s==='PENDING'&&i.stock<i.qty?'low':''}">${i.stock}</td></tr>`).join('')}
    <tr><th colspan=3 class="r">합계</th><th class="r">${won(o.total)}</th></tr></table>
    <h3>처리 이력</h3><div class="hint">${o.events.map(e => `${esc(e.created_at)} · ${esc(e.user_name||'시스템')} · ${esc(e.detail||e.action)}`).join('<br>')}</div>
    <div class="bar" style="margin-top:16px">
      <button class="b" id="a-confirm" ${s==='PENDING'?'':'disabled'}>주문 확정</button>
      <button class="b green" id="a-ship" ${s==='CONFIRMED'?'':'disabled'}>출고</button>
      <button class="b red" id="a-cancel" ${s==='PENDING'||s==='CONFIRMED'?'':'disabled'}>취소</button>
      ${admin ? `<button class="b red" id="a-refund" ${s==='SHIPPED'?'':'disabled'}>환불</button>` : ''}
      <span style="flex:1"></span><button class="b gray" id="a-close">닫기</button></div>
    ${admin ? '' : '<div class="hint">환불은 관리자만 처리할 수 있습니다.</div>'}`);
  const act = (btn, path, msg, body) => { const el = m.querySelector('#' + btn); if (!el) return;
    el.onclick = () => { el.disabled = true; run(async () => { await api(`/orders/${id}/${path}`, 'POST', body); toast(msg); m.remove(); renderMain(); }).finally(() => el.disabled = false); }; };
  act('a-confirm', 'confirm', '주문이 확정되고 재고가 차감되었습니다.');
  act('a-ship', 'ship', '출고 처리되었습니다.');
  m.querySelector('#a-cancel').onclick = () => { if (!confirm('이 주문을 취소할까요?' + (s==='CONFIRMED' ? '\n차감된 재고가 복원됩니다.' : ''))) return;
    run(async () => { await api(`/orders/${id}/cancel`, 'POST'); toast('취소되었습니다.'); m.remove(); renderMain(); }); };
  const rf = m.querySelector('#a-refund');
  if (rf) rf.onclick = () => { const back = confirm('환불 처리합니다.\n반품 상품을 재고에 다시 반영할까요?\n(확인=재입고, 취소=재고 반영 안 함)');
    if (!confirm('정말 환불 처리할까요? 되돌릴 수 없습니다.')) return;
    run(async () => { await api(`/orders/${id}/refund`, 'POST', {restock: back, reason: ''}); toast('환불 처리되었습니다.'); m.remove(); renderMain(); }); };
  m.querySelector('#a-close').onclick = () => m.remove();
}

async function newOrder() {
  const ps = await api('/products');
  const opts = ps.map(p => `<option value="${p.id}">${esc(p.name)} (${won(p.price)}, 재고 ${p.stock})</option>`).join('');
  const m = modal(`<h2 style="margin-top:0">주문 접수 (쇼핑몰 주문 입력)</h2>
    <div style="display:grid;gap:8px"><input id="c" placeholder="고객명"><input id="ph" placeholder="연락처"><input id="ad" placeholder="배송지"><input id="nt" placeholder="메모">
    <div id="lines"></div><button class="b gray" id="add" type="button">+ 상품 추가</button></div>
    <div class="bar" style="margin-top:16px"><button class="b" id="ok">접수</button><button class="b gray" id="no">닫기</button></div>`);
  const add = () => { const d = document.createElement('div'); d.className = 'bar';
    d.innerHTML = `<select style="flex:1">${opts}</select><input type="number" min="1" value="1" style="width:80px"><button class="b red" type="button">×</button>`;
    d.querySelector('button').onclick = () => d.remove(); m.querySelector('#lines').append(d); };
  add(); m.querySelector('#add').onclick = add; m.querySelector('#no').onclick = () => m.remove();
  m.querySelector('#ok').onclick = () => run(async () => {
    const items = [...m.querySelectorAll('#lines .bar')].map(d => ({product_id: +d.querySelector('select').value, qty: +d.querySelector('input').value}));
    await api('/orders', 'POST', {customer: m.querySelector('#c').value.trim(), phone: m.querySelector('#ph').value, address: m.querySelector('#ad').value, note: m.querySelector('#nt').value, items});
    toast('주문이 접수되었습니다.'); m.remove(); viewOrders();
  });
}

async function viewStock() {
  const ps = await api('/products');
  document.getElementById('mn').innerHTML = `<table><tr><th>SKU</th><th>상품</th><th class="r">단가</th><th class="r">재고</th><th class="r">안전재고</th><th></th></tr>
  ${ps.map(p => `<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td class="r">${won(p.price)}</td><td class="r ${p.stock<=p.safety_stock?'low':''}">${p.stock}</td><td class="r">${p.safety_stock}</td>
  <td><button class="b" data-in="${p.id}">입고</button> <button class="b gray" data-log="${p.id}">이력</button></td></tr>`).join('')}</table>`;
  document.querySelectorAll('[data-in]').forEach(b => b.onclick = () => {
    const v = prompt('입고 수량을 입력하세요'); if (v === null) return;
    const n = parseInt(v, 10); if (!(n > 0)) return toast('1 이상의 숫자를 입력하세요.', false);
    run(async () => { await api(`/products/${b.dataset.in}/receive`, 'POST', {qty: n}); toast('입고 처리되었습니다.'); viewStock(); }); });
  document.querySelectorAll('[data-log]').forEach(b => b.onclick = () => run(async () => {
    const l = await api('/stock-movements?product_id=' + b.dataset.log);
    const m = modal(`<h2 style="margin-top:0">재고 변동 이력</h2><table><tr><th>일시</th><th class="r">증감</th><th>사유</th><th>주문</th><th>처리자</th></tr>
      ${l.map(x => `<tr><td>${esc(x.created_at)}</td><td class="r ${x.delta<0?'low':''}">${x.delta>0?'+':''}${x.delta}</td><td>${esc(x.reason)}</td><td>${x.order_id?'#'+x.order_id:''}</td><td>${esc(x.user_name||'')}</td></tr>`).join('')}</table>
      <div class="bar" style="margin-top:12px"><button class="b gray">닫기</button></div>`);
    m.querySelector('button').onclick = () => m.remove(); }));
}
boot();
</script>
</body>
</html>
