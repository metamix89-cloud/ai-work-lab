<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가나다식품 주문 · 재고 백오피스</title>
<style>
  body { font-family: sans-serif; margin: 16px 24px; color: #222; }
  header { display: flex; gap: 16px; align-items: center; }
  h1 { font-size: 20px; margin: 0; }
  main { display: flex; gap: 24px; align-items: flex-start; margin-top: 12px; }
  #orders { flex: 1; } #stocks { width: 280px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f2f2f2; }
  [data-testid="message"] { min-height: 1.4em; margin: 8px 0; color: #b00020; }
  #error { color: #b00020; }
  button { margin-right: 4px; }
  .num { font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>주문 · 재고 백오피스</h1>
  <label>사용자 <select data-testid="user" id="user"></select></label>
</header>
<div data-testid="message" id="message"></div>
<div id="error" hidden><span>불러오지 못했습니다</span> <button id="retry">다시 시도</button></div>
<main>
  <section id="orders">
    <h2>주문</h2>
    <table>
      <thead><tr><th>주문 번호</th><th>손님</th><th>주문 시각</th><th>줄</th><th>상태</th><th>동작</th></tr></thead>
      <tbody id="order-body"></tbody>
    </table>
  </section>
  <section id="stocks">
    <h2>재고</h2>
    <table>
      <thead><tr><th>상품</th><th>재고</th></tr></thead>
      <tbody id="stock-body"></tbody>
    </table>
  </section>
</main>
<script>
const LABEL = { placed: "접수", confirmed: "확정", shipped: "출고", cancelled: "취소", refunded: "환불" };
const BUTTONS = {
  placed: [["confirm", "확정"], ["cancel", "취소"]],
  confirmed: [["ship", "출고"], ["cancel", "취소"]],
  shipped: [["refund", "환불"]],
  cancelled: [], refunded: []
};
let orders = [], prods = [];
const $ = (id) => document.getElementById(id);

function el(tag, text, attrs) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  return e;
}

function render() {
  const ob = $("order-body"); ob.replaceChildren();
  for (const o of orders) {
    const tr = el("tr", undefined, { "data-testid": "order", "data-id": o.order_id, "data-status": o.status });
    tr.append(el("td", o.order_id), el("td", o.customer), el("td", o.ordered_at));
    const lines = el("td");
    o.lines.forEach((l) => lines.append(el("div", l.name + " × " + l.qty)));
    tr.append(lines, el("td", LABEL[o.status]));
    const acts = el("td");
    for (const [a, t] of BUTTONS[o.status] || []) {
      const b = el("button", t, { "data-testid": "act-" + a });
      b.onclick = () => act(o.order_id, a);
      acts.append(b);
    }
    tr.append(acts); ob.append(tr);
  }
  const sb = $("stock-body"); sb.replaceChildren();
  for (const p of prods) {
    const tr = el("tr");
    tr.append(el("td", p.name), el("td", String(p.stock), { "data-testid": "stock", "data-id": p.product_id, class: "num" }));
    sb.append(tr);
  }
}

async function load() {
  try {
    const [u, p, o] = await Promise.all(["users", "products", "orders"].map(async (n) => {
      const r = await fetch("/api/" + n);
      if (!r.ok) throw new Error(n);
      return r.json();
    }));
    const sel = $("user"), keep = sel.value;
    sel.replaceChildren(...u.map((x) => el("option", x.name + " (" + (x.role === "manager" ? "관리자" : "직원") + ")", { value: x.user_id })));
    if (keep) sel.value = keep;
    prods = p; orders = o;
    $("error").hidden = true;
    render();
  } catch (e) {
    $("error").hidden = false;
  }
}

async function act(id, action) {
  try {
    const r = await fetch("/api/orders/" + encodeURIComponent(id) + "/" + action, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: $("user").value })
    });
    const d = await r.json();
    if (!r.ok) { $("message").textContent = d.detail; return; }
    $("message").textContent = "";
    orders = orders.map((o) => (o.order_id === d.order.order_id ? d.order : o));
    prods = d.products;
    render();
  } catch (e) {
    $("error").hidden = false;
  }
}

$("retry").onclick = load;
load();
</script>
</body>
</html>
