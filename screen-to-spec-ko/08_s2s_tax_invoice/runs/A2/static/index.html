<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>가나다식품 세금계산서</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Malgun Gothic",sans-serif;background:#f4f6f8;color:#222}
header{background:#1f5f3a;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}main{max-width:1000px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px #0001}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid #e5e8eb;text-align:left}
th{background:#f0f3f5;font-weight:600}.r{text-align:right}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #c6ccd2;border-radius:5px;width:100%}
td input[type=number]{text-align:right}td input[type=checkbox]{width:auto}
button{font:inherit;padding:7px 14px;border:0;border-radius:5px;background:#1f5f3a;color:#fff;cursor:pointer}
button.sub{background:#e3e7ea;color:#222}button.red{background:#c0392b}button.sm{padding:3px 9px;font-size:12px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}label{display:block;font-size:12px;color:#555;margin-bottom:2px}
.sum{display:flex;justify-content:flex-end;gap:28px;margin:14px 0;font-size:15px}.sum b{font-size:18px}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;background:#d8f0e0}.badge.수정{background:#fff0c2}.badge.취소{background:#f6d0cc}
.cancelled td{color:#999;text-decoration:line-through}.err{color:#c0392b;margin-top:8px}
.bar{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.bar input{max-width:260px}
</style></head><body>
<header><h1>가나다식품 · 세금계산서 발행</h1><button class="sub" onclick="newForm()">+ 새 계산서</button></header>
<main>
<section class="card" id="formCard" hidden>
  <h3 id="formTitle" style="margin-top:0"></h3>
  <div class="grid">
    <div><label>거래처</label><select id="customer" onchange="showCust()"></select><div id="custInfo" style="font-size:12px;color:#666;margin-top:4px"></div></div>
    <div><label>작성일자</label><input type="date" id="issueDate"></div>
  </div>
  <table><thead><tr><th>품목</th><th style="width:90px">규격</th><th style="width:80px">수량</th><th style="width:110px">단가</th><th style="width:50px">과세</th><th class="r" style="width:110px">공급가액</th><th style="width:40px"></th></tr></thead>
  <tbody id="rows"></tbody></table>
  <button class="sub sm" style="margin-top:8px" onclick="addRow()">+ 품목 추가</button>
  <div class="sum"><span>공급가액 <b id="sSupply">0</b></span><span>세액 <b id="sTax">0</b></span><span>합계 <b id="sTotal">0</b></span></div>
  <label>비고</label><input id="memo">
  <div style="margin-top:14px;display:flex;gap:8px"><button onclick="save()" id="saveBtn">발행</button><button class="sub" onclick="closeForm()">닫기</button></div>
  <div class="err" id="err"></div>
</section>
<section class="card">
  <div class="bar"><h3 style="margin:0">발행 목록</h3><input id="q" placeholder="거래처 / 번호 검색" oninput="loadList()"></div>
  <table><thead><tr><th>번호</th><th>작성일자</th><th>거래처</th><th class="r">공급가액</th><th class="r">세액</th><th class="r">합계</th><th>상태</th><th></th></tr></thead>
  <tbody id="list"></tbody></table>
</section>
</main>
<script>
const $=id=>document.getElementById(id), won=n=>Number(n).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let customers=[], editId=null;
const api=async(url,method='GET',body)=>{
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(typeof e.detail==='string'?e.detail:'입력값을 확인하세요 (품목명, 수량 1 이상, 단가 0 이상)')}
  return r.json()};
async function init(){customers=await api('/api/customers');
  $('customer').innerHTML=customers.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.biz_no)})</option>`).join('');loadList()}
function showCust(){const c=customers.find(c=>c.id==$('customer').value);$('custInfo').textContent=c?`대표 ${c.ceo} · ${c.address} · ${c.email}`:''}
function addRow(it={name:'',spec:'',qty:1,unit_price:0,taxable:true}){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input class="n" value="${esc(it.name)}"></td><td><input class="s" value="${esc(it.spec)}"></td>
  <td><input class="q" type="number" min="1" value="${it.qty}"></td><td><input class="p" type="number" min="0" value="${it.unit_price}"></td>
  <td><input class="t" type="checkbox" ${it.taxable?'checked':''}></td><td class="r line">0</td><td><button class="sm red" onclick="this.closest('tr').remove();calc()">×</button></td>`;
  tr.oninput=calc;tr.onchange=calc;$('rows').appendChild(tr);calc()}
function readItems(){return [...$('rows').children].map(tr=>({name:tr.querySelector('.n').value.trim(),spec:tr.querySelector('.s').value,
  qty:parseInt(tr.querySelector('.q').value)||0,unit_price:parseInt(tr.querySelector('.p').value)||0,taxable:tr.querySelector('.t').checked}))}
function calc(){let sup=0,tx=0;const trs=[...$('rows').children];
  readItems().forEach((it,i)=>{const l=it.qty*it.unit_price;sup+=l;if(it.taxable)tx+=l;trs[i].querySelector('.line').textContent=won(l)});
  const tax=Math.floor(tx*0.1);$('sSupply').textContent=won(sup);$('sTax').textContent=won(tax);$('sTotal').textContent=won(sup+tax)}
function openForm(title,btn){$('formCard').hidden=false;$('formTitle').textContent=title;$('saveBtn').textContent=btn;$('err').textContent='';$('formCard').scrollIntoView({behavior:'smooth'})}
function closeForm(){$('formCard').hidden=true;editId=null}
function newForm(){editId=null;$('rows').innerHTML='';$('memo').value='';$('issueDate').value=new Date().toLocaleDateString('sv');showCust();addRow();openForm('새 세금계산서','발행')}
async function edit(id){const d=await api('/api/invoices/'+id);editId=id;$('customer').value=d.customer_id;showCust();
  $('issueDate').value=d.issue_date;$('memo').value=d.memo||'';$('rows').innerHTML='';d.items.forEach(i=>addRow({...i,taxable:!!i.taxable}));
  openForm('세금계산서 수정 · '+d.number,'수정 저장')}
async function save(){const body={customer_id:+$('customer').value,issue_date:$('issueDate').value,memo:$('memo').value,items:readItems()};
  if(!body.issue_date)return $('err').textContent='작성일자를 입력하세요';
  if(body.items.some(i=>!i.name||i.qty<1))return $('err').textContent='모든 품목에 품목명과 1 이상의 수량이 필요합니다';
  try{await api(editId?'/api/invoices/'+editId:'/api/invoices',editId?'PUT':'POST',body);closeForm();loadList()}catch(e){$('err').textContent=e.message}}
async function cancelInv(id){if(!confirm('이 계산서를 취소 처리할까요?'))return;try{await api(`/api/invoices/${id}/cancel`,'POST');loadList()}catch(e){alert(e.message)}}
async function loadList(){const rows=await api('/api/invoices?q='+encodeURIComponent($('q').value));
  $('list').innerHTML=rows.map(r=>`<tr class="${r.status==='취소'?'cancelled':''}"><td>${esc(r.number)}</td><td>${r.issue_date}</td><td>${esc(r.customer_name)}</td>
  <td class="r">${won(r.supply)}</td><td class="r">${won(r.tax)}</td><td class="r"><b>${won(r.total)}</b></td><td><span class="badge ${r.status}">${r.status}</span></td>
  <td>${r.status==='취소'?'':`<button class="sm sub" onclick="edit(${r.id})">수정</button> <button class="sm red" onclick="cancelInv(${r.id})">취소</button>`}</td></tr>`).join('')
  ||'<tr><td colspan="8" style="text-align:center;color:#888">내역이 없습니다</td></tr>'}
init();
</script></body></html>
