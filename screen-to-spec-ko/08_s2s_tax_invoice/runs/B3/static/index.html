<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다식품 세금계산서 발행</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #f4f5f7; color: #222; }
  h1 { margin: 0; padding: 14px 20px; background: #2b4a7a; color: #fff; font-size: 18px; }
  .note { padding: 6px 20px; font-size: 12px; color: #666; }
  main { display: flex; gap: 16px; padding: 0 20px 20px; align-items: flex-start; }
  section { background: #fff; border: 1px solid #d8dce2; border-radius: 6px; padding: 14px; }
  #compose { flex: 0 0 440px; }
  #ledger { flex: 1; min-width: 0; }
  h2 { margin: 0 0 10px; font-size: 15px; }
  label { display: block; margin: 8px 0 3px; font-size: 13px; color: #555; }
  input, select, button { font: inherit; padding: 5px 7px; }
  select, input[type=date] { width: 100%; }
  .line { display: flex; gap: 6px; margin-bottom: 6px; }
  .line .item { flex: 1; min-width: 0; }
  .line .qty { width: 64px; }
  .line .price { width: 100px; }
  button { cursor: pointer; border: 1px solid #aab; background: #eef0f4; border-radius: 4px; }
  button.primary { background: #2b4a7a; color: #fff; border-color: #2b4a7a; }
  button:disabled { opacity: .5; cursor: default; }
  .pv { margin: 12px 0; padding: 8px 10px; background: #f0f4fa; border-radius: 4px; font-size: 14px; }
  .pv div { display: flex; justify-content: space-between; }
  #message { min-height: 22px; margin: 8px 0; font-size: 13px; color: #b3261e; }
  #message.ok { color: #1b6e3c; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid #e5e8ec; padding: 6px 8px; text-align: left; }
  td.num, th.num { text-align: right; }
  tr.invoice-row { cursor: pointer; }
  tr.invoice-row:hover { background: #f3f6fb; }
  tr.invoice-row.sel { background: #e4edfa; }
  .st { padding: 1px 7px; border-radius: 10px; font-size: 12px; }
  .st-발행 { background: #dff3e6; color: #1b6e3c; }
  .st-수정됨 { background: #fff0d1; color: #8a5a00; }
  .st-취소 { background: #eee; color: #777; text-decoration: line-through; }
  .totals { display: flex; gap: 20px; margin: 10px 0; font-size: 14px; }
  #detail { margin-top: 14px; padding-top: 10px; border-top: 2px solid #d8dce2; }
  #detail p { margin: 4px 0; font-size: 13px; }
  .err { padding: 20px; text-align: center; color: #b3261e; }
  .hint { font-size: 12px; color: #777; }
</style>
</head>
<body>
<h1>가나다식품 세금계산서</h1>
<div class="note">사내 발행 대장 연습 화면입니다. 국세청 전송이 없으며 실제 전자세금계산서가 아닙니다.</div>
<main>
  <section id="compose">
    <h2 id="compose-title">세금계산서 작성</h2>
    <label for="customer">거래처</label>
    <select id="customer" data-testid="customer"></select>
    <label for="issued">작성일</label>
    <input type="date" id="issued" data-testid="issued">
    <label>품목</label>
    <div id="lines"></div>
    <button type="button" data-testid="add-line" id="add-line">+ 줄 추가</button>
    <div class="pv">
      <div><span>공급가</span><span data-testid="pv-supply" id="pv-supply">0</span></div>
      <div><span>세액</span><span data-testid="pv-tax" id="pv-tax">0</span></div>
      <div><strong>합계</strong><strong data-testid="pv-total" id="pv-total">0</strong></div>
    </div>
    <div class="hint">미리보기 금액은 서버가 계산한 값입니다(저장되지 않음).</div>
    <div id="message" data-testid="message"></div>
    <button type="button" class="primary" data-testid="issue-btn" id="issue-btn">발행</button>
    <button type="button" id="preview-btn">미리보기</button>
    <button type="button" id="exit-amend" hidden>수정 취소</button>
  </section>

  <section id="ledger">
    <h2>발행 대장 <span id="month-label" class="hint"></span></h2>
    <div id="ledger-body"></div>
    <div id="detail"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const won = (n) => Number(n).toLocaleString('ko-KR');
let amendNo = null;      // 수정 발행 중인 원본 번호
let selected = null;     // 상세로 보는 번호
let customers = [];
let pvTimer = null;
let pvSeq = 0;

function today() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.detail) || '요청에 실패했습니다');
    err.rejected = true;
    throw err;
  }
  return data;
}

function say(text, ok) {
  const m = $('message');
  m.textContent = text || '';
  m.className = ok ? 'ok' : '';
}

/* ---------- 품목 줄 ---------- */
function addLine(item = '', qty = '', price = '') {
  const div = document.createElement('div');
  div.className = 'line';
  div.dataset.testid = 'line';
  div.setAttribute('data-testid', 'line');
  div.innerHTML =
    '<input class="item" data-testid="item" placeholder="품목명">' +
    '<input class="qty" data-testid="qty" type="number" min="1" step="1" placeholder="수량">' +
    '<input class="price" data-testid="price" type="number" min="0" step="1" placeholder="단가">' +
    '<button type="button" class="rm" title="줄 삭제">×</button>';
  const [i, q, p] = div.querySelectorAll('input');
  i.value = item; q.value = qty; p.value = price;
  div.addEventListener('input', schedulePreview);
  div.querySelector('.rm').onclick = () => {
    if ($('lines').children.length > 1) { div.remove(); schedulePreview(); }
  };
  $('lines').appendChild(div);
}

function readLines() {
  return [...$('lines').children].map((d) => {
    const [i, q, p] = d.querySelectorAll('input');
    const num = (v) => (v.trim() === '' ? null : Number(v));
    return { item: i.value, qty: num(q.value), unit_price: num(p.value) };
  });
}

function payload() {
  const body = { issued: $('issued').value, lines: readLines() };
  if (!amendNo) body.biz_no = $('customer').value;
  return body;
}

/* ---------- 미리보기 ---------- */
function schedulePreview() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => doPreview(false), 250);
}

async function doPreview(showError) {
  const seq = ++pvSeq;
  const body = payload();
  if (amendNo) body.biz_no = customers.length ? currentBiz : '';
  try {
    const r = await api('POST', '/api/invoices/preview', body);
    if (seq !== pvSeq) return;
    $('pv-supply').textContent = won(r.supply);
    $('pv-tax').textContent = won(r.tax);
    $('pv-total').textContent = won(r.total);
    if (showError) say('');
  } catch (e) {
    if (seq !== pvSeq) return;
    $('pv-supply').textContent = $('pv-tax').textContent = $('pv-total').textContent = '0';
    if (showError) say(e.message);
  }
}
let currentBiz = '';

/* ---------- 발행 / 수정 발행 ---------- */
async function issue() {
  $('issue-btn').disabled = true;
  try {
    let inv;
    if (amendNo) {
      inv = await api('POST', `/api/invoices/${amendNo}/amend`, payload());
      say(`수정 발행되었습니다: ${inv.invoice_no}`, true);
      exitAmend(false);
    } else {
      inv = await api('POST', '/api/invoices', payload());
      say(`발행되었습니다: ${inv.invoice_no}`, true);
      resetForm();
    }
    selected = inv.invoice_no;
    await loadLedger();
  } catch (e) {
    say(e.message);
  } finally {
    $('issue-btn').disabled = false;
  }
}

function resetForm() {
  $('lines').innerHTML = '';
  addLine();
  $('pv-supply').textContent = $('pv-tax').textContent = $('pv-total').textContent = '0';
}

function startAmend(inv) {
  amendNo = inv.invoice_no;
  currentBiz = inv.biz_no;
  $('compose-title').textContent = `수정 발행 (원본 ${inv.invoice_no})`;
  $('customer').value = inv.biz_no;
  $('customer').disabled = true;
  $('issued').value = inv.issued;
  $('lines').innerHTML = '';
  inv.lines.forEach((l) => addLine(l.item, l.qty, l.unit_price));
  $('issue-btn').textContent = '수정 발행';
  $('exit-amend').hidden = false;
  say('');
  doPreview(false);
}

function exitAmend(clear = true) {
  amendNo = null;
  currentBiz = '';
  $('compose-title').textContent = '세금계산서 작성';
  $('customer').disabled = false;
  $('issue-btn').textContent = '발행';
  $('exit-amend').hidden = true;
  $('issued').value = today();
  resetForm();
  if (clear) say('');
}

/* ---------- 대장 ---------- */
async function loadLedger() {
  const box = $('ledger-body');
  try {
    const r = await api('GET', '/api/invoices');
    $('month-label').textContent = `(${r.month})`;
    const rows = r.items.map((it) =>
      `<tr class="invoice-row${it.invoice_no === selected ? ' sel' : ''}" data-testid="invoice-row" data-no="${it.invoice_no}" data-status="${it.status}">
        <td>${it.invoice_no}</td><td>${it.issued}</td><td>${esc(it.customer)}</td>
        <td class="num">${won(it.supply)}</td><td class="num">${won(it.tax)}</td><td class="num">${won(it.total)}</td>
        <td><span class="st st-${it.status}">${it.status}</span></td></tr>`).join('');
    box.innerHTML =
      `<div class="totals">월 합계(발행 상태만)
        <span>공급가 <b data-testid="month-supply">${won(r.totals.supply)}</b></span>
        <span>세액 <b data-testid="month-tax">${won(r.totals.tax)}</b></span>
        <span>합계 <b data-testid="month-total">${won(r.totals.total)}</b></span></div>
      <table><thead><tr><th>번호</th><th>작성일</th><th>거래처</th><th class="num">공급가</th><th class="num">세액</th><th class="num">합계</th><th>상태</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7">이번 달 계산서가 없습니다</td></tr>'}</tbody></table>`;
    box.querySelectorAll('[data-testid=invoice-row]').forEach((tr) => {
      tr.onclick = () => { selected = tr.dataset.no; loadLedger(); };
    });
    await loadDetail();
  } catch (e) {
    showFail(box, loadLedger);
    $('detail').innerHTML = '';
  }
}

function showFail(box, retry) {
  box.innerHTML = '<div class="err"><p>불러오지 못했습니다</p><button type="button" class="retry">다시 시도</button></div>';
  box.querySelector('.retry').onclick = retry;
}

async function loadDetail() {
  const box = $('detail');
  if (!selected) { box.innerHTML = '<p class="hint">행을 누르면 상세가 보입니다.</p>'; return; }
  try {
    const inv = await api('GET', `/api/invoices/${encodeURIComponent(selected)}`);
    const lines = inv.lines.map((l) =>
      `<tr><td>${l.line}</td><td>${esc(l.item)}</td><td class="num">${won(l.qty)}</td><td class="num">${won(l.unit_price)}</td><td class="num">${won(l.line_supply)}</td></tr>`).join('');
    box.innerHTML =
      `<h2>${inv.invoice_no} <span class="st st-${inv.status}">${inv.status}</span></h2>
       <p>거래처: ${esc(inv.customer)} (${inv.biz_no}) · 작성일 ${inv.issued}</p>
       ${inv.amends ? `<p>이 계산서를 고친 것: ${inv.amends}</p>` : ''}
       ${inv.amended_by ? `<p>고쳐진 계산서: ${inv.amended_by}</p>` : ''}
       <table><thead><tr><th>줄</th><th>품목</th><th class="num">수량</th><th class="num">단가</th><th class="num">공급가</th></tr></thead><tbody>${lines}</tbody></table>
       <p>공급가 ${won(inv.supply)} · 세액 ${won(inv.tax)} · 합계 <b>${won(inv.total)}</b></p>
       ${inv.status === '발행' ? '<button type="button" data-testid="amend-btn">수정 발행</button> <button type="button" data-testid="cancel-btn">취소</button>' : ''}`;
    const ab = box.querySelector('[data-testid=amend-btn]');
    if (ab) {
      ab.onclick = () => startAmend(inv);
      box.querySelector('[data-testid=cancel-btn]').onclick = () => cancelInvoice(inv.invoice_no);
    }
  } catch (e) {
    showFail(box, loadDetail);
  }
}

async function cancelInvoice(no) {
  if (!confirm(`${no} 계산서를 취소할까요?`)) return;
  try {
    await api('POST', `/api/invoices/${encodeURIComponent(no)}/cancel`);
    say(`취소되었습니다: ${no}`, true);
    if (amendNo === no) exitAmend(false);
  } catch (e) {
    say(e.message);
  }
  loadLedger();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- 시작 ---------- */
async function init() {
  $('issued').value = today();
  addLine();
  $('add-line').onclick = () => addLine();
  $('issue-btn').onclick = issue;
  $('preview-btn').onclick = () => doPreview(true);
  $('exit-amend').onclick = () => exitAmend();
  $('issued').addEventListener('input', schedulePreview);
  $('customer').addEventListener('input', schedulePreview);
  try {
    customers = await api('GET', '/api/customers');
    $('customer').innerHTML = customers.map((c) => `<option value="${c.biz_no}">${esc(c.name)} (${c.biz_no})</option>`).join('');
  } catch (e) {
    say('불러오지 못했습니다 — 거래처');
  }
  loadLedger();
}
init();
</script>
</body>
</html>
