<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온소프트 사내 규정 검색</title>
<style>
body{font-family:"Malgun Gothic",sans-serif;max-width:820px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:22px;margin:0 0 12px}
form{display:flex;gap:8px}
input{flex:1;padding:10px;font-size:16px;border:1px solid #aab;border-radius:6px}
button{padding:8px 14px;font-size:14px;border:1px solid #567;background:#eef2f8;border-radius:6px;cursor:pointer}
.meta{font-size:12px;color:#667;margin:8px 0 16px}
.card{border:1px solid #ccd;border-radius:8px;padding:12px;margin:10px 0;cursor:pointer}
.head{font-size:13px;color:#345;font-weight:bold}
.title{font-size:16px;margin:4px 0}
.snip{font-size:14px;color:#444;margin-bottom:6px}
mark{background:#ffe680}
.full,.hist{margin-top:8px;padding:8px;background:#f6f7fa;border-radius:6px;font-size:14px;white-space:pre-wrap}
.old{border-left:3px solid #c88;padding-left:8px;margin:6px 0}
#no-result,#error{padding:16px;background:#fff6e5;border-radius:8px}
</style>
</head>
<body>
<h1>다온소프트 사내 규정 검색</h1>
<form id="f">
  <input data-testid="q" id="q" placeholder="검색어 (예: 연차 이월)" autocomplete="off">
  <button type="submit" data-testid="search-btn">검색</button>
</form>
<div class="meta" id="docs"></div>
<div id="count-wrap"></div>
<div id="out"></div>
<script>
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function api(url){
  const r = await fetch(url);
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw Object.assign(new Error("api"),{status:r.status,detail:j&&j.detail});
  return j;
}
function showError(retry){
  $("count-wrap").innerHTML="";
  $("out").innerHTML='<div id="error" data-testid="error">불러오지 못했습니다 <button type="button" id="retry">다시 시도</button></div>';
  $("retry").onclick=retry;
}
async function loadDocs(){
  try{
    const d = await api("/api/docs");
    const today = new Date().toISOString().slice(0,10);
    $("docs").textContent = d.map(x=>x.doc+" "+x.count+"개 조항").join(" · ")+" · 기준일 "+today;
  }catch(e){ $("docs").textContent=""; }
}
async function doSearch(){
  const q = $("q").value;
  try{
    render(await api("/api/search?q="+encodeURIComponent(q)));
  }catch(e){
    if(e.status===400){ $("count-wrap").innerHTML=""; $("out").textContent=e.detail||"검색어를 입력하세요"; }
    else showError(doSearch);
  }
}
function render(d){
  $("count-wrap").innerHTML='<p>검색 결과 <b data-testid="count">'+d.count+'</b>건</p>';
  if(d.count===0){
    $("out").innerHTML='<div id="no-result" data-testid="no-result">해당 규정 없음 — 인사팀(hr@daon.example)에 문의</div>';
    return;
  }
  $("out").innerHTML="";
  d.results.forEach(r=>{
    const c=document.createElement("div");
    c.className="card";
    c.setAttribute("data-testid","result");
    c.setAttribute("data-clause",r.clause_id);
    c.setAttribute("data-doc",r.doc);
    c.setAttribute("data-article",r.article);
    // snippet 은 서버가 <mark> 만 허용해 만든 HTML
    c.innerHTML='<div class="head">'+esc(r.doc)+' · '+esc(r.article)+' · 시행 '+esc(r.effective_from)+'</div>'
      +'<div class="title">'+esc(r.title)+'</div><div class="snip">'+r.snippet+'</div>'
      +(r.has_history?'<button type="button" data-testid="history-btn">개정 이력</button>':'')
      +'<div class="extra"></div>';
    c.onclick=()=>toggleFull(c,r.clause_id);
    const hb=c.querySelector('[data-testid="history-btn"]');
    if(hb) hb.onclick=ev=>{ev.stopPropagation();toggleHistory(c,r.clause_id);};
    $("out").appendChild(c);
  });
}
async function toggleFull(c,id){
  const ex=c.querySelector(".extra");
  const old=ex.querySelector('[data-testid="full-text"]');
  if(old){old.remove();return;}
  try{
    const d=await api("/api/clauses/"+encodeURIComponent(id));
    const el=document.createElement("div");
    el.className="full";
    el.setAttribute("data-testid","full-text");
    el.textContent=d.body;
    ex.prepend(el);
  }catch(e){ showError(()=>toggleFull(c,id)); }
}
async function toggleHistory(c,id){
  const ex=c.querySelector(".extra");
  const old=ex.querySelector(".hist");
  if(old){old.remove();return;}
  try{
    const h=await api("/api/clauses/"+encodeURIComponent(id)+"/history");
    const box=document.createElement("div");
    box.className="hist";
    h.forEach(x=>{
      const row=document.createElement("div");
      row.className="old";
      row.setAttribute("data-testid","history-item");
      row.textContent="개정 전 · 시행 "+x.effective_from+" ~ "+x.effective_to+"\n"+x.body;
      box.appendChild(row);
    });
    ex.appendChild(box);
  }catch(e){ showError(()=>toggleHistory(c,id)); }
}
$("f").addEventListener("submit",e=>{e.preventDefault();doSearch();});
loadDocs();
</script>
</body>
</html>
