<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온소프트 사내 규정 검색</title>
<style>
body{font-family:system-ui,"Malgun Gothic",sans-serif;max-width:820px;margin:0 auto;padding:24px;color:#222}
h1{font-size:22px}
form{display:flex;gap:8px}
input{flex:1;padding:10px;font-size:16px;border:1px solid #aaa;border-radius:6px}
button{padding:8px 14px;font-size:14px;border:1px solid #888;border-radius:6px;background:#f4f4f4;cursor:pointer}
.meta{font-size:12px;color:#666;margin:8px 0 16px}
.card{border:1px solid #ccc;border-radius:8px;padding:12px;margin:10px 0;cursor:pointer}
.head{font-weight:bold;color:#1a4d8f;font-size:13px}
.title{font-size:16px;margin:4px 0}
.snip mark{background:#ffe58a}
.full{margin-top:8px;padding:8px;background:#f7f7f7;white-space:pre-wrap}
.hist{margin-top:8px;padding:8px;border-left:3px solid #c88;background:#fbf3f3;font-size:14px}
.none,.error{padding:16px;background:#f7f7f7;border-radius:8px}
</style>
</head>
<body>
<h1>다온소프트 사내 규정 검색</h1>
<form id="f">
  <input data-testid="q" id="q" placeholder="검색어 (예: 연차 이월)" autocomplete="off">
  <button type="submit" data-testid="search-btn">검색</button>
</form>
<div class="meta" id="docs"></div>
<div id="count" data-testid="count"></div>
<div id="out"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
async function api(url){
  const r = await fetch(url);
  const j = await r.json().catch(() => null);
  if(!r.ok) throw new Error((j && j.detail) || "오류");
  return j;
}
function showError(retry){
  $("count").textContent = "";
  $("out").innerHTML = '<div class="error" data-testid="error">불러오지 못했습니다 <button type="button" id="retry">다시 시도</button></div>';
  $("retry").onclick = retry;
}
async function loadDocs(){
  try{
    const [d, m] = await Promise.all([api("/api/docs"), api("/api/meta")]);
    $("docs").textContent = "규정: " + d.map(x => x.doc + " " + x.count + "개 조항").join(" · ") + " · 기준일 " + m.today;
  }catch(e){ $("docs").textContent = ""; }
}
async function doSearch(){
  const q = $("q").value;
  if(!q.trim()){
    $("count").textContent = "";
    $("out").innerHTML = '<div class="none">검색어를 입력하세요</div>';
    return;
  }
  try{
    render(await api("/api/search?q=" + encodeURIComponent(q)));
  }catch(e){
    showError(doSearch);
  }
}
function render(d){
  $("count").textContent = "검색 결과 " + d.count + "건";
  if(!d.count){
    $("out").innerHTML = '<div class="none" data-testid="no-result">해당 규정 없음 — 인사팀(hr@daon.example)에 문의</div>';
    return;
  }
  $("out").innerHTML = "";
  for(const r of d.results){
    const c = document.createElement("div");
    c.className = "card";
    c.setAttribute("data-testid", "result");
    c.setAttribute("data-clause", r.clause_id);
    c.setAttribute("data-doc", r.doc);
    c.setAttribute("data-article", r.article);
    c.innerHTML = '<div class="head">' + esc(r.doc) + ' · ' + esc(r.article) + ' · 시행 ' + esc(r.effective_from) + '</div>' +
      '<div class="title">' + esc(r.title) + '</div><div class="snip">' + r.snippet + '</div>' +
      (r.has_history ? '<button type="button" data-testid="history-btn">개정 이력</button>' : '') +
      '<div class="extra"></div>';
    const extra = c.querySelector(".extra");
    c.addEventListener("click", async ev => {
      if(ev.target.closest("button") || ev.target.closest(".hist")) return;
      const open = extra.querySelector('[data-testid="full-text"]');
      if(open){ open.remove(); return; }
      try{
        const f = await api("/api/clauses/" + encodeURIComponent(r.clause_id));
        const el = document.createElement("div");
        el.className = "full";
        el.setAttribute("data-testid", "full-text");
        el.textContent = f.body;
        extra.prepend(el);
      }catch(e){ showError(doSearch); }
    });
    const hb = c.querySelector('[data-testid="history-btn"]');
    if(hb) hb.addEventListener("click", async () => {
      const old = extra.querySelectorAll('[data-testid="history-item"]');
      if(old.length){ old.forEach(x => x.remove()); return; }
      try{
        const h = await api("/api/clauses/" + encodeURIComponent(r.clause_id) + "/history");
        for(const x of h){
          const el = document.createElement("div");
          el.className = "hist";
          el.setAttribute("data-testid", "history-item");
          el.innerHTML = "<b>개정 전 · 시행 " + esc(x.effective_from) + " ~ " + esc(x.effective_to) + "</b><div>" + esc(x.body) + "</div>";
          extra.appendChild(el);
        }
      }catch(e){ showError(doSearch); }
    });
    $("out").appendChild(c);
  }
}
$("f").addEventListener("submit", e => { e.preventDefault(); doSearch(); });
loadDocs();
</script>
</body>
</html>
