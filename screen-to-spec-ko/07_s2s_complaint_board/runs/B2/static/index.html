<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸른구청 민원 현황판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f3f6fa; color: #1f2933; }
  header { background: #1e5aa8; color: #fff; padding: 12px 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  header label { font-size: 14px; }
  select, input, textarea, button { font: inherit; padding: 6px 8px; }
  main { padding: 16px 20px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: #fff; border-radius: 8px; padding: 10px 18px; min-width: 110px; box-shadow: 0 1px 2px #0002; }
  .stat .n { font-size: 26px; font-weight: bold; display: block; }
  .stat.od .n { color: #d32f2f; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }
  .col { background: #e3e9f1; border-radius: 8px; padding: 10px; min-height: 160px; }
  .col h2 { font-size: 15px; margin: 0 0 8px; }
  .card { background: #fff; border: 2px solid #fff; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; box-shadow: 0 1px 2px #0002; font-size: 14px; }
  .card[data-overdue="1"] { border-color: #d32f2f; }
  .card .t { font-weight: bold; margin-bottom: 4px; }
  .card .m { color: #52606d; font-size: 13px; }
  .late { color: #d32f2f; font-weight: bold; }
  #detail { background: #fff; border-radius: 8px; padding: 14px 18px; margin-top: 16px; box-shadow: 0 1px 2px #0002; }
  #detail[hidden] { display: none; }
  #detail h3 { margin: 0 0 8px; }
  .row { margin: 6px 0; }
  textarea { width: 100%; max-width: 480px; display: block; margin-bottom: 6px; }
  #message { margin-top: 12px; min-height: 24px; color: #d32f2f; font-weight: bold; }
  #message.ok { color: #2e7d32; }
  #error { background: #fff3f3; border: 1px solid #d32f2f; padding: 14px; border-radius: 8px; margin-bottom: 16px; }
  #error[hidden] { display: none; }
  ul { padding-left: 20px; }
  @media (max-width: 800px) { .board { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>푸른구청 민원 현황판</h1>
  <label>처리자 <select data-testid="actor" id="actor"></select></label>
  <span>기준일 <b data-testid="as-of" id="as-of"></b></span>
</header>
<main>
  <div id="error" hidden><span>불러오지 못했습니다</span> <button id="retry" type="button">다시 시도</button></div>
  <section class="stats" id="stats"></section>
  <section class="board" id="board"></section>
  <section id="detail" hidden></section>
  <div id="message" data-testid="message"></div>
</main>
<script>
const STATUSES = ["접수", "배정", "처리중", "종결"];
let staff = [], items = [], selected = null;
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.detail) || "오류"); err.detail = true; throw err; }
  return data;
}
function say(text, ok) { const m = $("message"); m.textContent = text || ""; m.className = ok ? "ok" : ""; }
function dueText(c) {
  if (c.status === "종결") return "기한 " + c.due;
  if (c.days_left < 0) return (-c.days_left) + "일 지남";
  return "D-" + c.days_left;
}

async function load() {
  try {
    const [st, sum, list] = await Promise.all([api("/api/staff"), api("/api/summary"), api("/api/complaints")]);
    staff = st; items = list.items;
    $("error").hidden = true;
    renderActor();
    $("as-of").textContent = sum.as_of;
    renderStats(sum);
    renderBoard();
    if (selected) await openDetail(selected, true);
  } catch (e) {
    $("error").hidden = false;
  }
}
function renderActor() {
  const a = $("actor"), cur = a.value;
  a.innerHTML = "";
  staff.forEach((s) => a.appendChild(el("option", { value: s.name }, s.name)));
  if (cur) a.value = cur;
}
function renderStats(sum) {
  const box = $("stats"); box.innerHTML = "";
  STATUSES.forEach((s) => {
    const d = el("div", { class: "stat" });
    d.appendChild(el("span", {}, s));
    d.appendChild(el("span", { class: "n", "data-testid": "count", "data-status": s }, String(sum.counts[s])));
    box.appendChild(d);
  });
  const d = el("div", { class: "stat od" });
  d.appendChild(el("span", {}, "기한 넘김"));
  d.appendChild(el("span", { class: "n", "data-testid": "overdue-count" }, String(sum.overdue)));
  box.appendChild(d);
}
function renderBoard() {
  const b = $("board"); b.innerHTML = "";
  STATUSES.forEach((s) => {
    const col = el("div", { class: "col", "data-testid": "column", "data-status": s });
    col.appendChild(el("h2", {}, s));
    items.filter((c) => c.status === s).forEach((c) => {
      const card = el("div", { class: "card", "data-testid": "complaint", "data-id": c.complaint_id, "data-overdue": c.overdue ? "1" : "0" });
      card.appendChild(el("div", { class: "t" }, c.title));
      card.appendChild(el("div", { class: "m" }, c.category + " · 접수 " + c.received));
      const due = el("div", { class: "m" }, dueText(c));
      if (c.overdue) due.classList.add("late");
      card.appendChild(due);
      card.appendChild(el("div", { class: "m" }, "담당 " + (c.assignee || "-")));
      card.addEventListener("click", () => openDetail(c.complaint_id));
      col.appendChild(card);
    });
    b.appendChild(col);
  });
}
async function openDetail(id, keepMsg) {
  if (!keepMsg) say("");
  selected = id;
  try {
    const [c, hist] = await Promise.all([api("/api/complaints/" + id), api("/api/complaints/" + id + "/history")]);
    renderDetail(c, hist);
  } catch (e) { say(e.detail ? e.message : "불러오지 못했습니다"); }
}
function renderDetail(c, hist) {
  const d = $("detail"); d.hidden = false; d.innerHTML = "";
  d.appendChild(el("h3", {}, c.complaint_id + " · " + c.title));
  d.appendChild(el("div", { class: "row" }, "분야: " + c.category + " / 상태: " + c.status + " / " + dueText(c)));
  d.appendChild(el("div", { class: "row" }, "담당자: " + (c.assignee || "-")));
  d.appendChild(el("div", { class: "row" }, "답변: " + (c.answer || "-")));
  const idx = STATUSES.indexOf(c.status);
  if (idx < STATUSES.length - 1) {
    const next = STATUSES[idx + 1];
    const form = el("div", { class: "row" });
    let sel = null, ans = null;
    if (next === "배정") {
      sel = el("select", { "data-testid": "assignee" });
      sel.appendChild(el("option", { value: "" }, "담당자 선택"));
      staff.forEach((s) => sel.appendChild(el("option", { value: s.name }, s.name)));
      form.appendChild(sel);
    }
    if (next === "종결") {
      ans = el("textarea", { "data-testid": "answer", placeholder: "답변을 입력하세요", rows: "3" });
      form.appendChild(ans);
    }
    const btn = el("button", { type: "button", "data-testid": "next-btn" }, "다음 단계 (" + next + ")");
    btn.addEventListener("click", async () => {
      try {
        await api("/api/complaints/" + c.complaint_id + "/transition", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ to: next, by: $("actor").value, assignee: sel ? sel.value : "", answer: ans ? ans.value : "" }),
        });
        await load();
        say(c.complaint_id + " → " + next + " 처리했습니다", true);
      } catch (e) { say(e.detail ? e.message : "불러오지 못했습니다"); }
    });
    form.appendChild(btn);
    d.appendChild(form);
  }
  d.appendChild(el("h4", {}, "처리 이력"));
  const ul = el("ul");
  hist.forEach((h) => ul.appendChild(el("li", { "data-testid": "history-item" }, h.at + " · " + h.from_status + " → " + h.to_status + " · " + h.by)));
  if (!hist.length) ul.appendChild(el("li", {}, "이력 없음"));
  d.appendChild(ul);
}
$("retry").addEventListener("click", load);
load();
</script>
</body>
</html>
