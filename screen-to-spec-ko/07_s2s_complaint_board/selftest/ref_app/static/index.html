<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>푸른구청 민원 현황판</title>
<style>
body{font-family:Pretendard,system-ui,sans-serif;background:#F6F7FB;color:#111318;margin:0;padding:20px}
h1{font-size:20px;margin:0}.top{display:flex;gap:12px;align-items:center}.meta{font-size:12px;color:#6B7280}
.nums{display:flex;gap:10px;margin:12px 0}.num{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:8px 14px;font-size:13px}.num b{font-size:20px;margin-left:6px}
.num.od{border-color:#FCA5A5;color:#B91C1C}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.col{background:#EEF0F4;border-radius:10px;padding:8px;min-height:200px}.col h3{margin:0 0 6px;font-size:13px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px;cursor:pointer}.card.od{border:2px solid #EF4444}
.detail{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:12px;margin-top:12px;font-size:13px}.msg{color:#B91C1C;min-height:18px;margin-top:6px}
</style></head><body>
<div class="top"><h1>푸른구청 민원 현황판</h1><label>처리자 <select data-testid="actor" id="actor"></select></label><span class="meta" data-testid="as-of" id="asof"></span></div>
<div class="nums" id="nums"></div>
<div class="board" id="board"></div>
<div class="detail" id="detail" style="display:none"></div>
<div class="msg" data-testid="message" id="msg"></div>
<script>
const FLOW=['접수','배정','처리중','종결'];const $=id=>document.getElementById(id);let staff=[];
async function api(u,o){const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'오류');return j;}
async function load(){
  try{
    if(!staff.length){staff=await api('/api/staff');$('actor').innerHTML=staff.map(s=>`<option>${s.name}</option>`).join('');}
    const [s,l]=await Promise.all([api('/api/summary'),api('/api/complaints')]);
    $('asof').textContent='기준일 '+s.as_of;
    $('nums').innerHTML=FLOW.map(f=>`<div class="num" data-testid="count" data-status="${f}">${f}<b>${s.counts[f]}</b></div>`).join('')+`<div class="num od" data-testid="overdue-count">기한 넘김<b>${s.overdue}</b></div>`;
    $('board').innerHTML=FLOW.map(f=>`<div class="col" data-testid="column" data-status="${f}"><h3>${f}</h3>${l.items.filter(i=>i.status===f).map(i=>`<div class="card ${i.overdue?'od':''}" data-testid="complaint" data-id="${i.complaint_id}" data-overdue="${i.overdue?1:0}"><b>${i.title}</b><br>${i.category} · 접수 ${i.received} · ${i.status==='종결'?'종결':(i.days_left<0?(-i.days_left)+'일 지남':'D-'+i.days_left)}${i.assignee?' · '+i.assignee:''}</div>`).join('')}</div>`).join('');
  }catch(e){$('board').innerHTML='<div>불러오지 못했습니다 <button onclick="load()">다시 시도</button></div>';}
}
async function show(id){
  const c=await api('/api/complaints/'+id);const h=await api('/api/complaints/'+id+'/history');const n=FLOW[FLOW.indexOf(c.status)+1];
  $('detail').style.display='';
  $('detail').innerHTML=`<b>${c.title}</b> · ${c.status} · 담당 ${c.assignee||'—'}<br>답변: ${c.answer||'—'}<br>
   ${n?`${n==='배정'?`<select data-testid="assignee" id="asg">${staff.map(s=>`<option>${s.name}</option>`).join('')}</select>`:''}${n==='종결'?`<input data-testid="answer" id="ans" placeholder="답변">`:''}<button data-testid="next-btn" onclick="next('${id}','${n}')">${n}(으)로</button>`:''}
   <div>${h.map(x=>`<div data-testid="history-item">${x.at} ${x.from_status} → ${x.to_status} · ${x.by}</div>`).join('')}</div>`;
}
async function next(id,to){
  $('msg').textContent='';
  try{await api('/api/complaints/'+id+'/transition',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,by:$('actor').value,assignee:$('asg')?$('asg').value:'',answer:$('ans')?$('ans').value:''})});await load();show(id);}
  catch(e){$('msg').textContent=e.message;}
}
$('board').onclick=e=>{const c=e.target.closest('.card');if(c)show(c.dataset.id);};
load();
</script></body></html>
