<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한빛요양병원 3병동 당직 순번표</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 20px; color: #222; background: #f6f7f9; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  button, input { font: inherit; padding: 6px 12px; }
  button { cursor: pointer; border: 1px solid #335; background: #fff; border-radius: 4px; }
  button:disabled { opacity: .4; cursor: default; }
  #status { padding: 3px 10px; border-radius: 12px; background: #e3e6ea; font-weight: bold; }
  #status[data-s="생성됨"] { background: #fff1c2; }
  #status[data-s="확정"] { background: #cdeccd; }
  .main { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .cal-wrap { flex: 3; min-width: 560px; position: relative; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .head { text-align: center; font-weight: bold; padding: 4px 0; }
  .head.we { color: #b33; }
  .day { background: #fff; border: 1px solid #ccd; border-radius: 4px; min-height: 78px; padding: 4px 6px; cursor: pointer; font-size: 13px; }
  .day[data-weekend="1"] { background: #fdf0f0; }
  .day.sel { outline: 3px solid #2a6df4; }
  .day .n { color: #666; font-size: 12px; }
  .day .who { font-weight: bold; font-size: 15px; min-height: 20px; }
  .day .ex { font-size: 11px; color: #a55; }
  .empty { min-height: 0; }
  .notice { text-align: center; padding: 10px; background: #fff8e0; border: 1px solid #e6d28a; border-radius: 4px; margin-bottom: 8px; }
  .side { flex: 1; min-width: 240px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #ccd; padding: 6px 10px; text-align: center; }
  #message { margin-top: 16px; min-height: 22px; color: #b00; font-weight: bold; }
  #message.ok { color: #164; }
  #error { background: #fde; border: 1px solid #c88; padding: 12px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<h1>한빛요양병원 3병동 당직 순번표</h1>

<div class="bar">
  <input type="month" id="month" data-testid="month" value="2026-11">
  <button id="generate" data-testid="generate-btn">생성</button>
  <button id="confirm" data-testid="confirm-btn">확정</button>
  <span id="status" data-testid="status" data-s="미생성">미생성</span>
  <button id="swap" data-testid="swap-btn" style="display:none">바꾸기</button>
</div>

<div id="error">불러오지 못했습니다 <button id="retry">다시 시도</button></div>

<div class="main">
  <div class="cal-wrap">
    <div id="notice" class="notice" style="display:none">아직 순번이 없습니다 — 생성을 누르세요</div>
    <div class="cal" id="cal"></div>
  </div>
  <div class="side">
    <table>
      <thead><tr><th>이름</th><th>총 횟수</th><th>주말</th></tr></thead>
      <tbody id="stats"></tbody>
    </table>
  </div>
</div>

<div id="message" data-testid="message"></div>

<script>
const $ = id => document.getElementById(id);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
let selected = [];

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const res = await fetch(path, opt);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}

function say(text, ok) {
  const m = $("message");
  m.textContent = text || "";
  m.className = ok ? "ok" : "";
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render(roster, unavail, stats) {
  $("error").style.display = "none";
  const st = $("status");
  st.textContent = roster.status;
  st.dataset.s = roster.status;
  $("notice").style.display = roster.status === "미생성" ? "block" : "none";
  $("confirm").disabled = roster.status === "미생성";
  $("generate").disabled = roster.status === "확정";

  const ex = {};
  unavail.forEach(u => (ex[u.date] = ex[u.date] || []).push(u.name));

  let html = WD.map((w, i) => `<div class="head${i === 0 || i === 6 ? " we" : ""}">${w}</div>`).join("");
  const first = new Date(roster.days[0].date + "T00:00:00").getDay();
  for (let i = 0; i < first; i++) html += `<div class="empty"></div>`;
  roster.days.forEach(d => {
    const names = ex[d.date] || [];
    html += `<div class="day${selected.includes(d.date) ? " sel" : ""}" data-testid="day" data-date="${d.date}"` +
      ` data-name="${esc(d.name)}"${d.weekend ? ' data-weekend="1"' : ""}>` +
      `<div class="n">${+d.date.slice(8)}일</div><div class="who">${esc(d.name)}</div>` +
      `<div class="ex">${names.length ? "제외: " + esc(names.join(", ")) : ""}</div></div>`;
  });
  $("cal").innerHTML = html;
  $("cal").querySelectorAll(".day").forEach(el => el.addEventListener("click", () => pick(el.dataset.date)));

  $("stats").innerHTML = stats.map(s =>
    `<tr data-testid="stat-row" data-name="${esc(s.name)}" data-total="${s.total}" data-weekend="${s.weekend}">` +
    `<td>${esc(s.name)}</td><td>${s.total}</td><td>${s.weekend}</td></tr>`).join("");
  updateSwap();
}

function updateSwap() {
  $("swap").style.display = selected.length === 2 ? "" : "none";
  document.querySelectorAll(".day").forEach(el => el.classList.toggle("sel", selected.includes(el.dataset.date)));
}

function pick(d) {
  const i = selected.indexOf(d);
  if (i >= 0) selected.splice(i, 1);
  else { if (selected.length === 2) selected.shift(); selected.push(d); }
  updateSwap();
}

async function load() {
  const month = $("month").value;
  if (!month) return;
  try {
    const [r, u, s] = await Promise.all([
      api("/api/roster?month=" + month),
      api("/api/unavailable?month=" + month),
      api("/api/stats?month=" + month),
    ]);
    if (!r.ok || !u.ok || !s.ok) throw new Error("fail");
    render(r.data, u.data, s.data);
  } catch (e) {
    $("error").style.display = "block";
  }
}

$("month").addEventListener("change", () => { selected = []; say(""); load(); });
$("retry").addEventListener("click", load);

$("generate").addEventListener("click", async () => {
  const r = await api("/api/roster/generate", { month: $("month").value });
  selected = [];
  say(r.ok ? "순번을 생성했습니다" : (r.data && r.data.detail) || "오류", r.ok);
  await load();
});

$("confirm").addEventListener("click", async () => {
  const r = await api("/api/roster/confirm", { month: $("month").value });
  say(r.ok ? "확정했습니다" : (r.data && r.data.detail) || "오류", r.ok);
  await load();
});

$("swap").addEventListener("click", async () => {
  const [a, b] = selected;
  const r = await api("/api/roster/swap", { date_a: a, date_b: b });
  if (r.ok) selected = [];
  say(r.ok ? `${a} ↔ ${b} 바꿨습니다` : (r.data && r.data.detail) || "오류", r.ok);
  await load();
});

load();
</script>
</body>
</html>
