<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한빛요양병원 3병동 당직 순번표</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 20px; color: #222; background: #f6f7f9; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button, input { font: inherit; padding: 6px 12px; }
  button { cursor: pointer; border: 1px solid #889; background: #fff; border-radius: 4px; }
  button.primary { background: #2a5db0; color: #fff; border-color: #2a5db0; }
  #status { font-weight: bold; padding: 4px 10px; border-radius: 12px; background: #e3e6eb; }
  #status[data-s="생성됨"] { background: #dcebff; }
  #status[data-s="확정"] { background: #d6f0dc; }
  .main { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .cal-wrap { flex: 1 1 640px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-weight: bold; padding: 4px; }
  .dow.we { color: #c33; }
  .day { background: #fff; border: 1px solid #ccd; border-radius: 4px; min-height: 76px; padding: 4px 6px; cursor: pointer; }
  .day[data-weekend="1"] { background: #fff3f0; }
  .day.sel { outline: 3px solid #2a5db0; }
  .day .d { font-size: 12px; color: #667; }
  .day .n { font-size: 16px; font-weight: bold; margin: 2px 0; }
  .day .u { font-size: 11px; color: #a55; }
  .blank { min-height: 0; }
  .empty { text-align: center; padding: 10px; color: #667; }
  table { border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #ccd; padding: 6px 14px; text-align: center; }
  #message { margin-top: 16px; min-height: 22px; color: #b00; font-weight: bold; }
  #message.ok { color: #276; }
  #error { display: none; padding: 20px; background: #fff; border: 1px solid #c88; }
</style>
</head>
<body>
<h1>한빛요양병원 3병동 당직 순번표</h1>
<div class="bar">
  <input type="month" id="month" data-testid="month" value="2026-11">
  <button class="primary" id="gen" data-testid="generate-btn">생성</button>
  <button id="conf" data-testid="confirm-btn">확정</button>
  <span id="status" data-testid="status" data-s="미생성">미생성</span>
  <button id="swap" data-testid="swap-btn" style="display:none">바꾸기</button>
</div>

<div id="error"><span>불러오지 못했습니다</span> <button id="retry">다시 시도</button></div>

<div class="main" id="content">
  <div class="cal-wrap">
    <div class="empty" id="empty" style="display:none">아직 순번이 없습니다 — 생성을 누르세요</div>
    <div class="cal" id="cal"></div>
  </div>
  <div>
    <table>
      <thead><tr><th>이름</th><th>총 횟수</th><th>주말 횟수</th></tr></thead>
      <tbody id="stats"></tbody>
    </table>
  </div>
</div>
<div id="message" data-testid="message"></div>

<script>
const $ = id => document.getElementById(id);
let selected = [];

function msg(text, ok) {
  const m = $("message");
  m.textContent = text || "";
  m.className = ok ? "ok" : "";
}

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  };
  const r = await fetch(path, opt);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) {
    const err = new Error(data && data.detail ? data.detail : "요청 실패");
    err.rejected = true;
    throw err;
  }
  return data;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(roster, unav, stats) {
  $("status").textContent = roster.status;
  $("status").dataset.s = roster.status;
  $("empty").style.display = roster.status === "미생성" ? "block" : "none";

  const cal = $("cal");
  cal.innerHTML = "";
  "일월화수목금토".split("").forEach((c, i) => cal.appendChild(el("div", "dow" + (i === 0 || i === 6 ? " we" : ""), c)));
  const first = new Date(roster.days[0].date + "T00:00:00").getDay();
  for (let i = 0; i < first; i++) cal.appendChild(el("div", "blank"));
  const um = {};
  unav.forEach(u => (um[u.date] = um[u.date] || []).push(u.name + "(" + u.reason + ")"));

  roster.days.forEach(d => {
    const c = el("div", "day");
    c.dataset.testid = "day";
    c.setAttribute("data-testid", "day");
    c.setAttribute("data-date", d.date);
    c.setAttribute("data-name", d.name);
    if (d.weekend) c.setAttribute("data-weekend", "1");
    if (selected.includes(d.date)) c.classList.add("sel");
    c.appendChild(el("div", "d", String(parseInt(d.date.slice(8), 10))));
    c.appendChild(el("div", "n", d.name));
    if (um[d.date]) c.appendChild(el("div", "u", "제외: " + um[d.date].join(", ")));
    c.addEventListener("click", () => toggle(d.date));
    cal.appendChild(c);
  });

  const tb = $("stats");
  tb.innerHTML = "";
  stats.forEach(s => {
    const tr = el("tr");
    tr.setAttribute("data-testid", "stat-row");
    tr.setAttribute("data-name", s.name);
    tr.setAttribute("data-total", s.total);
    tr.setAttribute("data-weekend", s.weekend);
    tr.appendChild(el("td", "", s.name));
    tr.appendChild(el("td", "", s.total));
    tr.appendChild(el("td", "", s.weekend));
    tb.appendChild(tr);
  });
  $("swap").style.display = selected.length === 2 ? "" : "none";
}

function toggle(d) {
  const i = selected.indexOf(d);
  if (i >= 0) selected.splice(i, 1);
  else { if (selected.length >= 2) selected.shift(); selected.push(d); }
  document.querySelectorAll('[data-testid="day"]').forEach(c =>
    c.classList.toggle("sel", selected.includes(c.getAttribute("data-date"))));
  $("swap").style.display = selected.length === 2 ? "" : "none";
}

async function load() {
  const month = $("month").value;
  try {
    const [roster, unav, stats] = await Promise.all([
      api("/api/roster?month=" + month),
      api("/api/unavailable?month=" + month),
      api("/api/stats?month=" + month),
    ]);
    $("error").style.display = "none";
    $("content").style.display = "";
    render(roster, unav, stats);
  } catch (e) {
    $("content").style.display = "none";
    $("error").style.display = "block";
  }
}

async function act(path, body, okText) {
  try {
    await api(path, body);
    msg(okText, true);
    selected = [];
  } catch (e) {
    msg(e.rejected ? e.message : "불러오지 못했습니다");
    if (!e.rejected) return load();
  }
  await load();
}

$("month").addEventListener("change", () => { selected = []; msg(""); load(); });
$("retry").addEventListener("click", () => { msg(""); load(); });
$("gen").addEventListener("click", () => act("/api/roster/generate", {month: $("month").value}, "순번을 생성했습니다"));
$("conf").addEventListener("click", () => act("/api/roster/confirm", {month: $("month").value}, "확정했습니다"));
$("swap").addEventListener("click", () => act("/api/roster/swap", {date_a: selected[0], date_b: selected[1]}, "바꿨습니다"));
load();
</script>
</body>
</html>
