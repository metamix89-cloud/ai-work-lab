<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한빛요양병원 3병동 당직 순번표</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 16px 24px; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { padding: 6px 14px; cursor: pointer; }
  [data-testid="status"] { font-weight: bold; padding: 2px 10px; border-radius: 10px; background: #eee; }
  .main { display: flex; gap: 24px; align-items: flex-start; }
  .left { flex: 3; }
  .right { flex: 1; min-width: 220px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .hd { text-align: center; font-weight: bold; padding: 4px; background: #f3f3f3; }
  .day { border: 1px solid #ccc; min-height: 74px; padding: 4px; cursor: pointer; font-size: 13px; }
  .day.blank { border: none; cursor: default; }
  .day[data-weekend="1"] { background: #fff4f0; }
  .day.sel { outline: 3px solid #2563eb; }
  .day .dn { color: #666; font-size: 12px; }
  .day .duty { font-weight: bold; font-size: 15px; min-height: 20px; }
  .day .ex { color: #b45309; font-size: 11px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: center; }
  th { background: #f3f3f3; }
  #empty { text-align: center; color: #666; padding: 8px; }
  #message { margin-top: 12px; min-height: 22px; color: #b91c1c; }
  #error { display: none; padding: 12px; background: #fee2e2; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>한빛요양병원 3병동 당직 순번표</h1>
<div class="bar">
  <input type="month" data-testid="month" id="month">
  <button data-testid="generate-btn" id="gen">생성</button>
  <button data-testid="confirm-btn" id="conf">확정</button>
  <span data-testid="status" id="status">미생성</span>
  <button data-testid="swap-btn" id="swap" style="display:none">바꾸기</button>
</div>
<div id="error">불러오지 못했습니다 <button id="retry">다시 시도</button></div>
<div class="main">
  <div class="left">
    <div id="empty" style="display:none">아직 순번이 없습니다 — 생성을 누르세요</div>
    <div class="grid" id="cal"></div>
  </div>
  <div class="right">
    <table>
      <thead><tr><th>이름</th><th>총</th><th>주말</th></tr></thead>
      <tbody id="stats"></tbody>
    </table>
  </div>
</div>
<div id="message" data-testid="message"></div>

<script>
const $ = id => document.getElementById(id);
let selected = [];
let curRoster = null;

function setMsg(t) { $("message").textContent = t || ""; }

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  };
  const res = await fetch(path, opt);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error(data && data.detail ? data.detail : "오류");
    err.status = res.status; err.detail = data && data.detail;
    throw err;
  }
  return data;
}

function currentMonth() { return $("month").value; }

async function load() {
  const month = currentMonth();
  if (!month) return;
  try {
    const [roster, stats, un] = await Promise.all([
      api("/api/roster?month=" + month),
      api("/api/stats?month=" + month),
      api("/api/unavailable?month=" + month),
    ]);
    $("error").style.display = "none";
    selected = [];
    render(roster, stats, un);
  } catch (e) {
    $("error").style.display = "block";
  }
}

function render(roster, stats, un) {
  curRoster = roster;
  $("status").textContent = roster.status;
  $("empty").style.display = roster.status === "미생성" ? "block" : "none";
  const ex = {};
  un.forEach(u => (ex[u.date] = ex[u.date] || []).push(u.name));
  const cal = $("cal");
  cal.innerHTML = "";
  ["일", "월", "화", "수", "목", "금", "토"].forEach(w => {
    const h = document.createElement("div"); h.className = "hd"; h.textContent = w; cal.appendChild(h);
  });
  const first = new Date(roster.days[0].date + "T00:00:00").getDay();
  for (let i = 0; i < first; i++) {
    const b = document.createElement("div"); b.className = "day blank"; b.setAttribute("data-blank", "1"); cal.appendChild(b);
  }
  roster.days.forEach(d => {
    const c = document.createElement("div");
    c.className = "day";
    c.setAttribute("data-testid", "day");
    c.setAttribute("data-date", d.date);
    c.setAttribute("data-name", d.name);
    if (d.weekend) c.setAttribute("data-weekend", "1");
    const dn = document.createElement("div"); dn.className = "dn"; dn.textContent = Number(d.date.slice(8));
    const duty = document.createElement("div"); duty.className = "duty"; duty.textContent = d.name;
    c.append(dn, duty);
    if (ex[d.date]) {
      const e = document.createElement("div"); e.className = "ex";
      e.textContent = "제외: " + ex[d.date].join(", ");
      c.appendChild(e);
    }
    c.addEventListener("click", () => toggle(d.date));
    cal.appendChild(c);
  });
  const tb = $("stats");
  tb.innerHTML = "";
  stats.forEach(s => {
    const tr = document.createElement("tr");
    tr.setAttribute("data-testid", "stat-row");
    tr.setAttribute("data-name", s.name);
    tr.setAttribute("data-total", s.total);
    tr.setAttribute("data-weekend", s.weekend);
    [s.name, s.total, s.weekend].forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  updateSel();
}

function toggle(date) {
  const i = selected.indexOf(date);
  if (i >= 0) selected.splice(i, 1);
  else { selected.push(date); if (selected.length > 2) selected.shift(); }
  updateSel();
}

function updateSel() {
  document.querySelectorAll('[data-testid="day"]').forEach(c =>
    c.classList.toggle("sel", selected.includes(c.getAttribute("data-date"))));
  $("swap").style.display = selected.length === 2 ? "" : "none";
}

$("gen").addEventListener("click", async () => {
  setMsg("");
  try { await api("/api/roster/generate", { month: currentMonth() }); } catch (e) { setMsg(e.detail || "불러오지 못했습니다"); }
  await load();
});
$("conf").addEventListener("click", async () => {
  setMsg("");
  try { await api("/api/roster/confirm", { month: currentMonth() }); } catch (e) { setMsg(e.detail || "불러오지 못했습니다"); }
  await load();
});
$("swap").addEventListener("click", async () => {
  setMsg("");
  const [a, b] = selected;
  try { await api("/api/roster/swap", { date_a: a, date_b: b }); }
  catch (e) { setMsg(e.detail || "불러오지 못했습니다"); }
  await load();
});
$("month").addEventListener("change", () => { setMsg(""); load(); });
$("retry").addEventListener("click", load);

$("month").value = "2026-11";
load();
</script>
</body>
</html>
